<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red envelope designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE6D6;--ink:#2B2620;--muted:#7A6F60;--card:#FFFCF6;--seal:#B23A2C;
  --W:168px;--H:240px;--T:22px;--R:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:34px;line-height:1;margin:0}
.lede{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:60ch;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:26px}
.s{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(80,55,20,.08),0 14px 30px -20px rgba(80,55,20,.45)}
.stage{position:relative;display:block;width:100%;height:420px;padding:0;border:0;cursor:pointer;overflow:hidden;font:inherit;
  background:radial-gradient(circle at 50% 50%,#FBF2E1,#F0DDBE 88%);-webkit-tap-highlight-color:transparent;transition:background .6s}
.stage.open{background:radial-gradient(circle at 50% 36%,#8A2A1C,#3A0C0A 78%)}
.stage:focus-visible{outline:3px solid var(--seal);outline-offset:-3px}
.hint{position:absolute;left:0;right:0;bottom:14px;font:600 12px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9A7A52;transition:color .4s}
.stage.open .hint{color:#F7C977}
.meta{padding:14px 18px 18px}
.meta h2{margin:0;font-size:16px;font-weight:600}
.meta h2 span{font-family:"Noto Serif SC",serif;color:var(--seal);font-weight:700;margin-left:6px}
.meta p{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.num{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:7px;background:var(--seal);color:#fff;font:800 13px/1 "Baloo 2",sans-serif;vertical-align:1px}

/* the scene: light behind, a shadow on the floor, the envelope in 3D */
.scene{position:absolute;inset:0 0 30px;display:grid;place-items:center;perspective:1000px;perspective-origin:50% 30%}
.rays{position:absolute;left:50%;top:calc(50% - var(--H)/2 + 10px);width:0;height:0;opacity:0;transform:scale(.3);transition:opacity .4s .35s,transform .7s cubic-bezier(.2,1.2,.4,1) .35s}
.rays svg{position:absolute;left:-320px;top:-320px;width:640px;height:640px;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.open .rays{opacity:1;transform:translateY(52px) scale(1)}
.floor{position:absolute;left:50%;top:calc(50% + var(--H)/2 + 6px);width:190px;height:22px;margin-left:-95px;border-radius:50%;background:radial-gradient(closest-side,rgba(70,40,10,.32),transparent);animation:floor 3s ease-in-out infinite}
@keyframes floor{0%,100%{transform:scale(1)}30%{transform:scale(.86)}60%{transform:scale(.93)}}

.env{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d;transform:rotateX(10deg) rotateY(-30deg);animation:sway 3s ease-in-out infinite}
@keyframes sway{
  0%,100%{transform:translateY(0) rotateX(10deg) rotateY(-30deg) rotateZ(0)}
  15%{transform:translateY(-8px) rotateX(10deg) rotateY(-14deg) rotateZ(-4deg)}
  30%{transform:translateY(-14px) rotateX(12deg) rotateY(-36deg) rotateZ(4deg)}
  45%{transform:translateY(-6px) rotateX(10deg) rotateY(-22deg) rotateZ(-1.5deg)}
  60%{transform:translateY(0) rotateX(10deg) rotateY(-30deg) rotateZ(0)}}
.open .env{animation:opened .7s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes opened{0%{transform:rotateX(10deg) rotateY(-30deg) scale(.94)}100%{transform:translateY(62px) rotateX(14deg) rotateY(-24deg) scale(.92)}}
.open .floor{animation:none;transform:translateY(52px)}

.env>*{position:absolute}
.face{inset:0}
.face svg,.flap svg{display:block;width:100%;height:100%;overflow:visible}
.front{transform:translateZ(calc(var(--T)/2))}
.front::after{content:"";position:absolute;inset:0;border-radius:var(--R);pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%,rgba(0,0,0,0) 62%,rgba(0,0,0,.18))}
.back{transform:translateZ(calc(var(--T)/-2)) rotateY(180deg);border-radius:var(--R)}
.side{left:calc((var(--W) - var(--T))/2);top:var(--R);width:var(--T);height:calc(var(--H) - 2*var(--R))}
.side.r{transform:rotateY(90deg) translateZ(calc(var(--W)/2))}
.side.l{transform:rotateY(-90deg) translateZ(calc(var(--W)/2))}
.cap{left:var(--R);top:calc((var(--H) - var(--T))/2);width:calc(var(--W) - 2*var(--R));height:var(--T)}
.cap.t{transform:rotateX(90deg) translateZ(calc(var(--H)/2))}
.cap.b{transform:rotateX(-90deg) translateZ(calc(var(--H)/2))}
.side::after,.cap::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.0) 0 3px,rgba(0,0,0,.12) 3px 4px)}
.cap::after{display:none}
.cap.t{filter:brightness(1.25)}

/* the light and the coins live between the front and the back, so the front hides them until they rise out */
.glow{left:-50px;right:-50px;top:-70px;height:140px;border-radius:50%;background:radial-gradient(closest-side,#FFF8D8,rgba(255,214,90,.8) 40%,rgba(255,176,32,0) 100%);
  transform:translateZ(0) scale(.2);opacity:0;transition:opacity .3s .3s,transform .5s .3s}
.open .glow{opacity:1;transform:translateZ(0) scale(1)}
.coin{left:calc(50% - 23px);top:40px;width:46px;height:46px;transform:translateZ(var(--z,0px)) translateY(0);opacity:0;transition:transform .6s cubic-bezier(.2,1.25,.5,1),opacity .15s}
.coin svg{width:100%;height:100%;overflow:visible}
.open .coin{opacity:1;transform:translateZ(var(--z,0px)) translate(var(--x),var(--y)) rotate(var(--r))}

/* the flap is hinged at the top edge. Opening swings its tip toward you and up; the hinge slides back so the flap ends up
   standing behind the coins, like it's fixed to the back of the envelope */
.flap{left:0;top:0;width:var(--W);height:var(--FH);transform-origin:50% 0;transform-style:preserve-3d;
  transform:translateZ(calc(var(--T)/2 + 1px)) rotateX(0);transition:transform .55s cubic-bezier(.5,0,.3,1.25)}
.flap>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .in{transform:rotateY(180deg)}
.open .flap{transform:translateZ(calc(var(--T)/-2)) rotateX(196deg)}
.open .coin:nth-of-type(1){transition-delay:.42s}.open .coin:nth-of-type(2){transition-delay:.5s}.open .coin:nth-of-type(3){transition-delay:.56s}.open .coin:nth-of-type(4){transition-delay:.62s}.open .coin:nth-of-type(5){transition-delay:.68s}
.stage:not(.open) .flap{transition-delay:.15s}

@media (prefers-reduced-motion:reduce){.env,.floor,.rays svg{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>Red envelope designs</h1>
  <p class="lede">The three you liked, now in 3D: turned a little to the side so you see the paper's edge, swaying like a <b>lì xì</b> (利是) that's ready on the path. <b>Tap one to open it:</b> the flap swings up and back in 3D, light pours out and the coins jump up.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
/* drawn in a 240 x 300 space. The body runs x 50..190, y 70..270; the flap hangs from the top edge (y 70).
   On screen that is 168 x 240 px (1.2 px a unit) */
const X0 = 50, X1 = 190, Y0 = 70, Y1 = 270, CX = 120, R = 10, K = 1.2;
const GOLD = '#F6C445', GOLD_D = '#B9800F', GOLD_L = '#FFE9A3';
const HAN = 'font-family:"Noto Serif SC",serif';

const bodyRect = (fill, stroke) => `<rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" rx="${R}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
const vFlap = (tip = 150) => `M${X0} ${Y0 + R}Q${X0} ${Y0} ${X0 + R} ${Y0}H${X1 - R}Q${X1} ${Y0} ${X1} ${Y0 + R}V${Y0 + 18}Q${CX} ${tip + 26} ${X0} ${Y0 + 18}Z`;
const coinSvg = `<svg viewBox="-17 -17 34 34"><circle r="15" fill="#FFC21F" stroke="#8A4A06" stroke-width="2.6"/><circle r="10.5" fill="none" stroke="#E89B0C" stroke-width="1.8"/><rect x="-4" y="-4" width="8" height="8" fill="#7A2410" stroke="#8A4A06" stroke-width="2"/><path d="M-10 -5a11 11 0 0 1 5-5" fill="none" stroke="#FFF3B0" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const lin = (id, a, b, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;

const DESIGNS = [
  { name: 'Plum blossom', zh: '梅花', note: 'Soft red fading to coral, a plum branch in bloom running across the flap and down the front, and a small gold 春 (spring) seal.',
    draw(id) {
      const bloom = (x, y, s, c = '#FFD6DF') => `<g transform="translate(${x} ${y}) scale(${s})">${[0, 72, 144, 216, 288].map(a => `<circle cx="${Math.cos((a - 90) * Math.PI / 180) * 7}" cy="${Math.sin((a - 90) * Math.PI / 180) * 7}" r="6.5" fill="${c}" stroke="#C2405E" stroke-width="1.6"/>`).join('')}<circle r="3.8" fill="${GOLD}" stroke="${GOLD_D}" stroke-width="1.2"/></g>`;
      return {
        defs: lin(id + 'b', '#E8333B', '#FF7A64') + lin(id + 'f', '#F45252', '#EC3D40'),
        inner: '#A0202A',
        body: bodyRect(`url(#${id}b)`, '#8F1D22')
          + `<path d="M${X1} 170Q160 190 138 196Q110 204 96 232Q88 248 ${X0 + 4} 258M138 196q-6-16 4-28M110 214q16 4 26 18" fill="none" stroke="#5A2A1C" stroke-width="5" stroke-linecap="round"/>`
          + bloom(142, 166, 1) + bloom(136, 234, .85, '#fff') + bloom(98, 226, 1.05) + bloom(66, 254, .7, '#fff') + bloom(176, 182, .6)
          + [[78, 190], [170, 214], [118, 252], [158, 252]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.2" fill="${GOLD_L}" opacity=".9"/>`).join('')
          + `<rect x="${X0 + R}" y="160" width="26" height="26" rx="4" fill="${GOLD}" stroke="${GOLD_D}" stroke-width="2.5"/><text x="${X0 + 27}" y="174" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="900" fill="#B3202A" style="${HAN}">春</text>`,
        flap: `<path d="${vFlap(140)}" fill="url(#${id}f)" stroke="#8F1D22" stroke-width="3" stroke-linejoin="round"/>`
          + `<path d="M${X0 + 6} ${Y0 + 26}Q90 96 128 100Q150 102 166 86M110 98q2-14 14-20" fill="none" stroke="#5A2A1C" stroke-width="4.5" stroke-linecap="round"/>`
          + bloom(92, 94, .9, '#fff') + bloom(130, 76, .8) + bloom(160, 92, .95) + bloom(124, 106, .65, '#fff')
      };
    } },

  { name: 'Golden clouds', zh: '祥云', note: 'Deep crimson with lucky clouds pressed into the paper, tied shut with a gold string wound round two gold buttons. Feels like a gift.',
    draw(id) {
      const cloud = (x, y, s, c) => `<path transform="translate(${x} ${y}) scale(${s})" d="M-24 6q-8 0-8-8t9-8q2-10 13-10t13 9q4-6 11-4t7 9q8 0 8 6t-8 6Z M-14 -2q4-5 9-1q4 4 0 7" fill="none" stroke="${c}" stroke-width="${3 / s}" stroke-linecap="round" stroke-linejoin="round"/>`;
      return {
        defs: lin(id + 'b', '#B3202A', '#7D1219') + lin(id + 'f', '#C4282F', '#951820'),
        inner: '#5E0C12',
        body: bodyRect(`url(#${id}b)`, '#4E0A0F')
          + cloud(88, 196, 1.2, '#D8434A') + cloud(158, 232, 1, '#D8434A') + cloud(86, 250, .7, '#D8434A') + cloud(162, 176, .7, '#D8434A')
          + `<path d="M${X0 + 8} ${Y1 - 16}H${X1 - 8}" stroke="${GOLD}" stroke-width="3" opacity=".8"/><path d="M${X0 + 8} ${Y1 - 10}H${X1 - 8}" stroke="${GOLD}" stroke-width="1.5" opacity=".6"/>`
          + `<circle cx="${CX}" cy="208" r="12" fill="${GOLD}" stroke="${GOLD_D}" stroke-width="3"/><circle cx="${CX}" cy="208" r="4" fill="${GOLD_D}"/>`,
        flap: `<path d="${vFlap(140)}" fill="url(#${id}f)" stroke="#4E0A0F" stroke-width="3" stroke-linejoin="round"/>`
          + cloud(92, 92, .9, '#E05A60') + cloud(150, 96, .8, '#E05A60')
          + `<path d="M${X0 + 2} ${Y0 + 3}H${X1 - 2}" stroke="${GOLD}" stroke-width="3"/>`
          + `<circle cx="${CX}" cy="146" r="13" fill="${GOLD}" stroke="${GOLD_D}" stroke-width="3"/><circle cx="${CX}" cy="146" r="4.5" fill="${GOLD_D}"/>`
          + `<path d="M${CX - R} 146C${CX - R} 168 ${CX + 16} 186 ${CX + R} 208C${CX + 12} 224 ${CX - 12} 224 ${CX - R} 208C${CX - 16} 186 ${CX + R} 168 ${CX + R} 146C${CX + R} 128 ${CX - R} 128 ${CX - R} 146Z" fill="none" stroke="${GOLD}" stroke-width="2.6" stroke-linejoin="round"/>`
          + `<path d="M${CX + 10} 214q10 14 4 26M${CX + 6} 216q2 16-6 22" fill="none" stroke="${GOLD}" stroke-width="2.4" stroke-linecap="round"/>`
          + `<circle cx="${CX}" cy="146" r="13" fill="${GOLD}" stroke="${GOLD_D}" stroke-width="3"/><circle cx="${CX}" cy="146" r="4.5" fill="${GOLD_D}"/>`
      };
    } },

  { name: 'Jade clasp', zh: '平安', note: 'Clean and modern, a nod to the app\'s jade logo: a gold lattice like a paper window cut, and a jade 平安扣 clasp with a red tassel at the flap\'s tip.',
    draw(id) {
      const lat = [];
      for (let y = 176; y <= 252; y += 19) for (let x = 66; x <= 174; x += 18) lat.push(`<path d="M${x} ${y - 7}L${x + 7} ${y}L${x} ${y + 7}L${x - 7} ${y}Z" fill="none" stroke="${GOLD}" stroke-width="1.4" opacity=".55"/>`);
      return {
        defs: lin(id + 'b', '#D8262C', '#A3141B') + lin(id + 'f', '#E2342F', '#C01E23') + `<mask id="${id}m"><circle cx="${CX}" cy="150" r="22" fill="#fff"/><circle cx="${CX}" cy="150" r="8.5" fill="#000"/></mask>`
          + `<clipPath id="${id}c"><rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" rx="${R}"/></clipPath>`,
        inner: '#7A0F14',
        body: bodyRect(`url(#${id}b)`, '#6E0E12')
          + `<g clip-path="url(#${id}c)">${lat.join('')}</g>`
          + `<rect x="${X0 + 10}" y="${Y0 + 10}" width="${X1 - X0 - 20}" height="${Y1 - Y0 - 20}" rx="9" fill="none" stroke="${GOLD}" stroke-width="1.6" opacity=".7"/>`,
        flap: `<path d="M${X0} ${Y0 + R}Q${X0} ${Y0} ${X0 + R} ${Y0}H${X1 - R}Q${X1} ${Y0} ${X1} ${Y0 + R}V${Y0 + 16}L${CX} 152L${X0} ${Y0 + 16}Z" fill="url(#${id}f)" stroke="#6E0E12" stroke-width="3" stroke-linejoin="round"/>`
          + `<path d="M${X0 + 12} ${Y0 + 20}L${CX} 140L${X1 - 12} ${Y0 + 20}" fill="none" stroke="${GOLD}" stroke-width="1.8" opacity=".75"/>`
          + `<circle cx="${CX}" cy="152" r="24" fill="#6E0E12" opacity=".25"/>`
          + `<g mask="url(#${id}m)"><circle cx="${CX}" cy="150" r="22" fill="#5CC898"/><circle cx="${CX + 2}" cy="152" r="17" fill="none" stroke="#2FA273" stroke-width="7"/><path d="M${CX - 16} 142a17 17 0 0 1 9-8" stroke="#B6F0D2" stroke-width="4" fill="none" stroke-linecap="round"/></g>`
          + `<circle cx="${CX}" cy="150" r="22" fill="none" stroke="#1F5A41" stroke-width="2.6"/><circle cx="${CX}" cy="150" r="8.5" fill="none" stroke="#1F5A41" stroke-width="2.4"/>`
          + `<path d="M${CX} 172v10" stroke="#E2342F" stroke-width="3"/><path d="M${CX - 7} 182h14l3 34q-10 6-20 0z" fill="#E43A2E" stroke="#8E1612" stroke-width="2.4" stroke-linejoin="round"/><path d="M${CX - 4} 190v22M${CX} 190v24M${CX + 4} 190v22" stroke="#FF8A6E" stroke-width="1.4"/><rect x="${CX - 8}" y="180" width="16" height="6" rx="2" fill="${GOLD}" stroke="${GOLD_D}" stroke-width="1.6"/>`
      };
    } },
];
/* the paper's edge, and where the flap's drawing ends (user units below the top edge) */
const EDGE = { 'Plum blossom': ['#C42A33', '#E85A50', 0, 90], 'Golden clouds': ['#6E1018', '#8A1820', 1, 175], 'Jade clasp': ['#8E1218', '#A8161E', 1, 155] };

const RAYS = `<svg viewBox="-320 -320 640 640"><defs><linearGradient id="rg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".85"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></linearGradient></defs>${Array.from({ length: 16 }, (_, i) => `<path d="M0 0L-16 -310L16 -310Z" transform="rotate(${i * 22.5})" fill="url(#rg)"/>`).join('')}</svg>`;
const COINS = [[-74, -96, -20, 4], [0, -128, 6, 6], [74, -100, 22, 4], [-36, -60, -8, 12], [38, -64, 14, 12]];

document.getElementById('grid').innerHTML = DESIGNS.map((D, i) => {
  const id = 'lx' + i, d = D.draw(id), [e1, e2, gold, fh] = EDGE[D.name];
  const sideBg = gold ? `background:linear-gradient(90deg,transparent 44%,${GOLD} 44% 56%,transparent 56%),linear-gradient(90deg,${e1},${e2},${e1})` : `background:linear-gradient(90deg,${e1},${e2},${e1})`;
  const capBg = gold ? `background:linear-gradient(0deg,transparent 44%,${GOLD} 44% 56%,transparent 56%),linear-gradient(0deg,${e1},${e2},${e1})` : `background:linear-gradient(0deg,${e1},${e2},${e1})`;
  const FH = fh;   // flap box height in user units
  const flapBox = `viewBox="${X0} ${Y0} ${X1 - X0} ${FH}"`;
  return `<article class="s">
    <button class="stage" aria-pressed="false" aria-label="${D.name} red envelope. Tap to open">
      <div class="scene">
        <div class="rays">${RAYS}</div>
        <div class="floor"></div>
        <div class="env" style="--FH:${FH * K}px">
          <div class="face back" style="background:${d.inner};box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)"></div>
          <div class="side r" style="${sideBg}"></div><div class="side l" style="${sideBg}"></div>
          <div class="cap t" style="${capBg}"></div><div class="cap b" style="${capBg}"></div>
          <div class="glow"></div>
          ${COINS.map(([x, y, r, z]) => `<div class="coin" style="--x:${x}px;--y:${y}px;--r:${r}deg;--z:${z - 8}px">${coinSvg}</div>`).join('')}
          <div class="face front"><svg viewBox="${X0} ${Y0} ${X1 - X0} ${Y1 - Y0}" aria-hidden="true"><defs>${d.defs}</defs>${d.body}</svg></div>
          <div class="flap">
            <div class="out"><svg ${flapBox} aria-hidden="true"><defs>${d.defs.replaceAll(`id="${id}`, `id="${id}o`).replaceAll(`#${id}`, `#${id}o`)}</defs>${d.flap.replaceAll(`#${id}`, `#${id}o`)}</svg></div>
            <div class="in"><svg ${flapBox} aria-hidden="true"><path d="${D.name === 'Jade clasp' ? `M${X0} ${Y0 + R}Q${X0} ${Y0} ${X0 + R} ${Y0}H${X1 - R}Q${X1} ${Y0} ${X1} ${Y0 + R}V${Y0 + 16}L${CX} 152L${X0} ${Y0 + 16}Z` : vFlap(140)}" fill="${d.inner}" stroke="rgba(0,0,0,.35)" stroke-width="3" stroke-linejoin="round"/><path d="M${X0 + 8} ${Y0 + 4}H${X1 - 8}" stroke="rgba(255,255,255,.12)" stroke-width="3"/></svg></div>
          </div>
        </div>
      </div>
      <span class="hint">Tap to open</span>
    </button>
    <div class="meta"><h2><span class="num">${i + 1}</span>${D.name}<span>${D.zh}</span></h2><p>${D.note}</p></div>
  </article>`;
}).join('');

document.querySelectorAll('.stage').forEach(b => b.addEventListener('click', () => {
  const on = b.classList.toggle('open');
  b.setAttribute('aria-pressed', on);
  b.querySelector('.hint').textContent = on ? 'Tap to close' : 'Tap to open';
}));
</script>
</body>
</html>
