/* English -> Chinese: exact meanings first ("eat" finds 吃 "to eat"), then words that mention it; common words first within each group */
function searchEnglish(D, q) {
  q = q.toLowerCase().trim().replace(/\s+/g, ' ').replace(/^(to|a|an|the) /, '');
  if (q.length < 2) return [];
  const re = new RegExp(`(^|[^a-z])${escRe(q)}($|[^a-z])`), hits = [];
  for (const row of D.rows) {
    const e = row.lc ||= row.e.toLowerCase();
    if (!e.includes(q) || !re.test(e)) continue;
    const ms = e.split('; ').map(m => plainMeaning(m).replace(/^(to|a|an|the) /, ''));
    const k = ms.indexOf(q);
    hits.push([k === 0 ? 0 : k > 0 ? 1 : re.test(ms[0]) ? 2 : 3, row]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1].r - b[1].r);
  const seen = new Set(), out = [];
  for (const [, row] of hits) { if (seen.has(row.h)) continue; seen.add(row.h); out.push(row); if (out.length >= 12) break; }
  return out;
}

/* ---------- word bank ----------
   Everything you add with Quick add lands here; the count of different characters is "characters you know". */
function bankCharList() {   // oldest first
  const seen = new Set();
  for (let i = db.bank.length - 1; i >= 0; i--) for (const c of hanChars(db.bank[i].hanzi)) seen.add(c);
  return [...seen];
}
const bankHas = hz => db.bank.find(w => w.hanzi === hz);
function addCardTo(d, w) {
  if (d.cards.some(c => c.hanzi === w.hanzi)) return false;
  d.cards.push({ id: uid(), en: w.en, hanzi: w.hanzi, pinyin: w.pinyin, created: Date.now(), hist: [] });
  return true;
}
function newDeckNamed(name) {
  const d = { id: uid(), name, accent: ACCENTS[db.decks.length % ACCENTS.length], created: Date.now(), cards: [] };
  db.decks.push(d); save(); return d;
}
/* chips for picking decks; `has` = decks that already have the word (shown, not tappable) */
function deckChips(box, sel, has, onChange) {
  const paint = () => {
    box.innerHTML = db.decks.map(d => has.has(d.id)
      ? `<span class="chip has" style="--accent:${d.accent}"><i></i>${esc(d.name)} ✓</span>`
      : `<button class="chip ${sel.has(d.id) ? 'on' : ''}" data-id="${d.id}" style="--accent:${d.accent}"><i></i>${esc(d.name)}</button>`).join('')
      + `<button class="chip add" data-new="1">${I.plus.replace('class="i"', 'class="i" style="width:16px;height:16px"')}New deck</button>`;
  };
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.id) { sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id); b.classList.toggle('on'); onChange(); return; }
    if (!b.dataset.new) return;
    b.outerHTML = `<div class="chip-new"><input class="input" placeholder="New deck name" maxlength="40" autocomplete="off"><button class="btn btn-primary">Create</button></div>`;
    const wrap = box.querySelector('.chip-new'), inp = wrap.querySelector('input');
    const make = () => { const name = inp.value.trim(); if (!name) { inp.focus(); return; } const d = newDeckNamed(name); sel.add(d.id); LOG.add('deck-new', { name, from: 'chips' }); paint(); onChange(); };
    wrap.querySelector('button').onclick = make; inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); make(); } };
    inp.focus();
  };
  paint();
}

function quickAddSheet() {
  const Q = { mode: db.prefs.qaMode || 'write', word: '', pick: null, reading: 0, enDirty: false, D: null, seq: 0 };
  const sel = new Set();   // decks to also add to; kept while the pop-up stays open
  openSheet(`<h3>Quick add</h3>
    <div class="seg qa-seg" id="qaSeg">${[['write', 'Write'], ['pinyin', 'Pinyin'], ['english', 'English']].map(([k, l]) => `<button data-m="${k}" class="${Q.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="compose"><div class="qa-word"><div class="compose-hz" id="qaHz"></div><div class="compose-py" id="qaPy"></div></div>
      <button class="icon-btn" id="qaBk" aria-label="Delete last character">${I.bksp}</button></div>
    <div id="qaMode"></div>
    <div id="qaInfo" hidden>
      <div class="means" id="qaReads" style="margin:4px 0 12px"></div>
      <label class="field"><span class="lbl"><span>Meaning · English</span><span class="lbl-note" id="qaNote"></span></span>
        <input class="input" id="qaEn" placeholder="What it means" autocomplete="off"></label>
      <div class="means" id="qaMeans"></div>
    </div>
    <div class="field"><span class="lbl"><span>Also add to decks</span><span class="lbl-note">optional</span></span><div class="chips" id="qaDecks"></div></div>
    <button class="btn btn-primary wide" id="qaAdd" disabled>Add to word bank</button>`,
  sh => {
    const $q = s => sh.querySelector(s);
    const hzEl = $q('#qaHz'), pyEl = $q('#qaPy'), modeEl = $q('#qaMode'), info = $q('#qaInfo'), enEl = $q('#qaEn'), addBtn = $q('#qaAdd');
    const readings = () => (Q.D && Q.word && Q.D.byHz.get(Q.word)) || [];
    const curPinyin = () => readings()[Q.reading]?.p || autoPinyin(Q.word);

    const paintButton = () => {
      const hz = hanChars(Q.word).length, had = Q.word && bankHas(Q.word), n = sel.size;
      addBtn.disabled = !hz || (had && !n);
      addBtn.textContent = !hz ? 'Add to word bank' : had ? (n ? `Add to ${plural(n, 'deck')}` : 'Already in your word bank')
        : `Add to word bank${n ? ` + ${plural(n, 'deck')}` : ''}`;
    };
    const paintInfo = () => {
      const R = readings();
      info.hidden = !Q.word;
      if (!Q.word) return;
      const row = R[Q.reading];
      $q('#qaReads').innerHTML = R.length > 1 ? R.map((r, i) => `<button class="mean ${i === Q.reading ? 'on' : ''}" data-r="${i}">${esc(r.p)}</button>`).join('') : '';
      const ms = row ? meanings(row) : [];
      if (!Q.enDirty) enEl.value = ms[0] ? plainMeaning(ms[0]) : (bankHas(Q.word)?.en || '');
      $q('#qaMeans').innerHTML = ms.length > 1 ? ms.map(m => `<button class="mean">${esc(plainMeaning(m))}</button>`).join('') : '';
      $q('#qaNote').textContent = row ? 'from the dictionary · editable' : Q.D ? 'not in the dictionary · type it' : '';
    };
    const paintWord = () => {
      hzEl.textContent = Q.word || (Q.mode === 'write' ? 'Write a character below…' : Q.mode === 'pinyin' ? 'Type pinyin below…' : 'Search in English below…');
      hzEl.classList.toggle('ph', !Q.word);
      pyEl.textContent = Q.word ? curPinyin() : '';
      paintInfo(); paintButton();
    };
    const setWord = (w, row, typed) => {
      Q.word = w; Q.enDirty = false; Q.typed = typed || '';
      const R = readings(), said = Q.typed && R.findIndex(r => normPy(r.p) === Q.typed);   // the reading you typed comes first
      Q.reading = row ? Math.max(0, R.indexOf(row)) : said > 0 ? said : 0;
      paintWord();
    };
    $q('#qaReads').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; Q.reading = +b.dataset.r; Q.enDirty = false; paintWord(); };
    $q('#qaMeans').onclick = e => { const b = e.target.closest('.mean'); if (!b) return; enEl.value = b.textContent; Q.enDirty = true; };
    enEl.addEventListener('input', () => { Q.enDirty = true; });
    $q('#qaBk').onclick = () => { if (Q.word) setWord([...Q.word].slice(0, -1).join('')); };
    deckChips($q('#qaDecks'), sel, new Set(), paintButton);

    /* --- the three ways in --- */
    const modes = {
      write() {
        const s = Math.min(210, Math.max(150, sh.clientWidth - 48 - 116));
        modeEl.innerHTML = `<div class="qa-pad"><div class="tzg no-drag" id="qaBox" style="--s:${s}px">${TZG}<canvas></canvas></div>
          <div class="qa-tools"><button class="pill" id="qaUndo">${I.undo}Undo</button><button class="pill" id="qaClr">${I.trash}Clear</button></div></div>
          <div class="cands" id="qaC" style="margin-bottom:8px"><span class="msg">Write one character — matches appear here.</span></div>`;
        const box = $q('#qaBox'), cv = box.querySelector('canvas'), dpr = Math.min(3, devicePixelRatio || 1), cands = $q('#qaC');
        cv.width = cv.height = s * dpr; cv.style.width = cv.style.height = s + 'px';
        box._ctx = cv.getContext('2d'); box._ctx.setTransform(dpr, 0, 0, dpr, 0, 0); box._s = s; box._strokes = [];
        let cur = null, t;
        const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp }; };
        const read = () => {
          clearTimeout(t); const seq = ++Q.seq;
          if (!box._strokes.length) { cands.innerHTML = '<span class="msg">Write one character — matches appear here.</span>'; return; }
          t = setTimeout(async () => {
            try {
              const list = (await recognize(box._strokes, s)).filter(c => [...c].length === 1 && HAN.test(c)).slice(0, 12);
              if (seq !== Q.seq) return;
              cands.innerHTML = list.length ? list.map(c => `<button class="cand">${esc(c)}</button>`).join('') : '<span class="msg">No match yet — keep writing.</span>';
              cands.scrollLeft = 0;
            } catch (_) { if (seq === Q.seq) cands.innerHTML = '<span class="msg">Offline — handwriting needs internet. Try Pinyin.</span>'; }
          }, 160);
        };
        const clearPad = () => { box._strokes = []; redraw(box); read(); };
        cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = [pt(e)]; box._strokes.push(cur); redraw(box); });
        cv.addEventListener('pointermove', e => { if (!cur) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; for (const ev of (evs.length ? evs : [e])) cur.push(pt(ev)); redraw(box); });
        const up = () => { if (cur) { cur = null; read(); } };
        cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
        $q('#qaUndo').onclick = () => { box._strokes.pop(); redraw(box); read(); };
        $q('#qaClr').onclick = clearPad;
        cands.onclick = e => { const b = e.target.closest('.cand'); if (!b) return; LOG.add('qa-write-pick', { picked: b.textContent, strokes: box._strokes.length }); setWord(Q.word + b.textContent); clearPad(); };
        Q.reset = clearPad;
      },
      pinyin() {
        modeEl.innerHTML = `<input class="input" id="qaIn" placeholder="Type pinyin — e.g. tushuguan" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
          <div class="cands" id="qaC"><span class="msg">Characters appear here as you type.</span></div>`;
        const inp = $q('#qaIn'), cands = $q('#qaC'); let t;
        const paint = list => {
          if (!inp.value) { cands.innerHTML = `<span class="msg">${Q.word ? 'Keep typing to add more.' : 'Characters appear here as you type.'}</span>`; cands._list = []; return; }
          cands.innerHTML = list.length ? list.map((x, i) => `<button class="cand" data-i="${i}">${esc(x.h)}</button>`).join('') : '<span class="msg">No match yet…</span>';
          cands.scrollLeft = 0; cands._list = list;
        };
        const lookup = () => {
          const py = normPy(inp.value); clearTimeout(t);
          if (!py) { paint([]); return; }
          const seq = ++Q.seq;
          t = setTimeout(async () => {
            try { const list = await fetchCands(py); if (seq === Q.seq) paint(list); }
            catch (e) { if (e.name !== 'AbortError' && seq === Q.seq) cands.innerHTML = '<span class="msg">Offline — pinyin lookup needs internet.</span>'; }
          }, 110);
        };
        const pick = i => {
          const x = cands._list?.[i]; if (!x) return;
          LOG.add('qa-pinyin-pick', { typed: normPy(inp.value), picked: x.h, choice: i + 1 });
          setWord(Q.word + x.h, null, (Q.word ? Q.typed : '') + normPy(inp.value).slice(0, x.len)); inp.value = normPy(inp.value).slice(x.len); lookup(); inp.focus();
        };
        cands.addEventListener('pointerdown', e => { if (e.target.closest('.cand')) e.preventDefault(); });
        cands.onclick = e => { const b = e.target.closest('.cand'); if (b) pick(+b.dataset.i); };
        inp.addEventListener('input', () => {
          const han = hanChars(inp.value).join('');
          if (han) { setWord(Q.word + han); inp.value = inp.value.replace(/\p{Script=Han}/gu, ''); }
          lookup();
        });
        inp.addEventListener('keydown', e => {
          if ((e.key === 'Enter' || e.key === ' ') && inp.value && cands._list?.length) { e.preventDefault(); pick(0); }
          else if (e.key === 'Backspace' && !inp.value && Q.word) { e.preventDefault(); setWord([...Q.word].slice(0, -1).join('')); }
        });
        Q.reset = () => { inp.value = ''; paint([]); };
        setTimeout(() => inp.focus(), 250);
      },
      english() {
        modeEl.innerHTML = `<input class="input" id="qaIn" placeholder="Type English — e.g. library" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <div class="en-res" id="qaR"><span class="msg">Matching Chinese words appear here.</span></div>`;
        const inp = $q('#qaIn'), res = $q('#qaR'); let t;
        const run = async () => {
          const q = inp.value.trim(), seq = ++Q.seq;
          if (q.length < 2) { res.innerHTML = '<span class="msg">Matching Chinese words appear here.</span>'; return; }
          if (!Q.D) { res.innerHTML = '<span class="msg">Loading the dictionary…</span>'; try { Q.D = await loadDict(); } catch (_) { if (seq === Q.seq) res.innerHTML = '<span class="msg">Couldn’t load the dictionary. Are you online?</span>'; return; } }
          if (seq !== Q.seq) return;
          const rows = searchEnglish(Q.D, q); res._rows = rows;
          res.innerHTML = rows.length ? rows.map((r, i) => `<button class="en-row" data-i="${i}"><span class="hz">${esc(r.h)}</span>
              <span class="wm"><div class="wp">${esc(r.p)}</div><div class="we">${esc(r.e)}</div></span></button>`).join('')
            : `<span class="msg">Nothing found for “${esc(q)}”. Try another word.</span>`;
        };
        inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 140); });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); run(); } });
        res.onclick = e => {
          const b = e.target.closest('.en-row'); if (!b) return; const row = res._rows[+b.dataset.i];
          LOG.add('qa-english-pick', { typed: inp.value.trim(), picked: row.h, choice: +b.dataset.i + 1 });
          setWord(row.h, row); inp.blur();
          res._rows = []; res.innerHTML = `<span class="msg">Picked ${esc(row.h)}. Type again to search for another word.</span>`;
        };
        Q.reset = () => { inp.value = ''; run(); };
        setTimeout(() => inp.focus(), 250);
      },
    };
    const setMode = m => {
      Q.mode = m; db.prefs.qaMode = m; save(); Q.seq++;
      $q('#qaSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
      modes[m](); paintWord();
    };
    $q('#qaSeg').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.m !== Q.mode) setMode(b.dataset.m); };

    addBtn.onclick = () => {
      const hz = Q.word, en = enEl.value.trim(), pinyin = curPinyin();
      if (!hanChars(hz).length) return;
      if (sel.size && !en) { enEl.focus(); toast('Add a meaning — it goes on the back of the card'); return; }
      let w = bankHas(hz); const isNew = !w;
      if (isNew) { w = { id: uid(), hanzi: hz, pinyin, en, added: Date.now(), hsk: S.H ? S.H.byHz.get(hz)?.lv || 0 : undefined }; db.bank.unshift(w); }
      else if (en && !w.en) w.en = en;
      const card = { hanzi: hz, pinyin, en: en || w.en };
      const into = [...sel].map(deckById).filter(Boolean).filter(d => addCardTo(d, card));
      save();
      LOG.add('quick-add', { hz, pinyin, en, via: Q.mode, new_in_bank: isNew, decks: into.map(d => d.name) });
      toast(`${isNew ? `Added ${hz} to your word bank` : `${hz} is already in your word bank`}${into.length ? ` · ${into.length === 1 ? into[0].name : plural(into.length, 'deck')}` : ''}`);
      setWord(''); Q.reset?.(); render();
    };
    setMode(Q.mode);
    loadDict().then(D => { Q.D = D; paintWord(); }).catch(() => {});
  });
}

function mountBank() {
  const q = $('#bankQ'); if (!q) return;
  wireSearch(q, () => q.oninput());
  q.oninput = () => { const s = q.value.trim().toLowerCase(), sp = normPy(s); $$('#bankWords .word-row').forEach(r => { r.hidden = !!s && !r.dataset.s.includes(s) && !(sp && r.dataset.s.includes(sp)); }); };
}
function wordSheet(id) {
  const w = db.bank.find(x => x.id === id); if (!w) return;
  const has = new Set(db.decks.filter(d => d.cards.some(c => c.hanzi === w.hanzi)).map(d => d.id)), sel = new Set();
  openSheet(`<div class="compose" style="margin-bottom:16px"><div class="qa-word"><div class="compose-hz">${esc(w.hanzi)}</div><div class="compose-py">${esc(w.pinyin)}</div></div></div>
    <label class="field"><span class="lbl">Meaning · English</span><input class="input" id="wEn" value="${esc(w.en || '')}" placeholder="What it means" autocomplete="off"></label>
    <div class="field"><span class="lbl"><span>Decks</span><span class="lbl-note">tap to add it</span></span><div class="chips" id="wDecks"></div></div>
    <div class="row-btns" style="margin-top:6px"><button class="btn btn-ghost" id="wDel" style="flex:0 0 56px;padding:0;color:var(--seal)" aria-label="Remove from word bank">${I.trash}</button>
      <button class="btn btn-primary" id="wSave">Done</button></div>`,
  sh => {
    const en = sh.querySelector('#wEn'), btn = sh.querySelector('#wSave');
    const paint = () => { btn.textContent = sel.size ? `Save + add to ${plural(sel.size, 'deck')}` : 'Done'; };
    deckChips(sh.querySelector('#wDecks'), sel, has, paint);
    btn.onclick = () => {
      w.en = en.value.trim();
      if (sel.size && !w.en) { en.focus(); toast('Add a meaning — it goes on the back of the card'); return; }
      const into = [...sel].map(deckById).filter(Boolean).filter(d => addCardTo(d, w));
      save(); closeSheet(); render();
      if (into.length) toast(`Added ${w.hanzi} to ${into.length === 1 ? into[0].name : plural(into.length, 'deck')}`);
    };
    sh.querySelector('#wDel').onclick = () => confirmSheet('Remove from word bank?', `${esc(w.hanzi)} will leave your word bank. Cards in your decks stay.`, 'Remove', () => {
      db.bank = db.bank.filter(x => x !== w); save(); render(); toast('Removed from word bank');
    });
  });
}

/* search field with a magnifier and a clear button; onClear runs after the text is wiped */
const searchField = (id, ph) => `<label class="search">${I.search}<input id="${id}" type="search" placeholder="${ph}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button type="button" class="clr" hidden aria-label="Clear">${I.close}</button></label>`;
function wireSearch(inp, onClear) {
  const clr = inp.parentElement.querySelector('.clr');
  inp.addEventListener('input', () => { clr.hidden = !inp.value; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  clr.onclick = e => { e.preventDefault(); inp.value = ''; clr.hidden = true; onClear(); inp.focus(); };
}

/* ---------- HSK lists ----------
   dict/hsk.tsv: the HSK 3.0 word lists of the 2026 syllabus (levels 1-6, and 7 for the 7-9 band), from
   complete-hsk-vocabulary (MIT) with CC-CEDICT meanings; rebuild with tools/build_hsk.py.
   One line per word: level <TAB> simplified <TAB> pinyin <TAB> meanings. */
const HSK_NAME = l => l === 7 ? 'HSK 7–9' : 'HSK ' + l;
const HSK_COUNT = { 1: 294, 2: 197, 3: 487, 4: 972, 5: 1547, 6: 1684, 7: 4876 };   // words per level, shown before the lists load
/* the shelf of HSK levels on the Decks page; rings fill in once the lists are loaded */
function HskShelf() {
  const inBank = S.H && new Set(db.bank.map(w => w.hanzi));
  return `<div class="shelf" id="hskShelf">${[1, 2, 3, 4, 5, 6, 7].map(l => {
    const L = S.H?.levels[l], n = L ? L.length : HSK_COUNT[l], k = L ? L.filter(r => inBank.has(r.h)).length : 0;
    return `<button class="shelf-tile" data-act="hsk-level" data-lv="${l}">${ring(l === 7 ? '7–9' : String(l), n ? k / n : 0)}
      <span class="shelf-t">${HSK_NAME(l)}</span><span class="shelf-s">${k ? `${k.toLocaleString('en')} of ${n.toLocaleString('en')}` : `${n.toLocaleString('en')} words`}</span></button>`;
  }).join('')}</div>`;
}
let hskP = null;
function loadHsk() {
  return hskP ||= fetch('dict/hsk.tsv').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
    const levels = {}, byHz = new Map();
    for (const l of t.split('\n')) {
      if (!l || l[0] === '#') continue;
      const [lv, h, p, e] = l.split('\t'); if (!h) continue;
      const row = { lv: +lv, h, p, e: e || '' };
      (levels[row.lv] ||= []).push(row); if (!byHz.has(h)) byHz.set(h, row);
    }
    S.H = { levels, byHz }; tagBank(); return S.H;
  }).catch(e => { hskP = null; throw e; });
}
function tagBank() {   // note each bank word's HSK level (0 = not on the lists), so practice can pick by level
  if (!S.H) return; let changed = false;
  for (const w of db.bank) { const lv = S.H.byHz.get(w.hanzi)?.lv || 0; if (w.hsk !== lv) { w.hsk = lv; changed = true; } }
  if (changed) save();
}
function shortMeaning(e) {   // what goes on the back of the card: the first meaning, plus a second when both are short
  const ms = e.split('; ').map(m => plainMeaning(m).replace(/\s*\([^)]*\)$/, '') || plainMeaning(m)).filter(Boolean); if (!ms.length) return '';   // "to be (followed by…)" -> "to be"
  return ms[0].length < 14 && ms[1] && (ms[0] + '; ' + ms[1]).length <= 30 ? ms[0] + '; ' + ms[1] : ms[0];
}
const ring = (label, frac) => `<span class="ring-s"><svg viewBox="0 0 36 36"><circle class="rb" cx="18" cy="18" r="15.5"/>${frac > 0 ? `<circle class="rf" cx="18" cy="18" r="15.5" stroke-dasharray="${(Math.max(.03, frac) * 97.4).toFixed(1)} 97.4"/>` : ''}</svg><b class="${label.length > 1 ? 'sm' : ''}">${label}</b></span>`;
/* The word bank as a deck, so Flip cards and Write work on it; only the levels picked in "Practise" */
function bankDeck() {
  const set = new Set(db.prefs.bankLevels || []);
  const cards = db.bank.filter(w => !set.size || set.has(w.hsk || 0));
  const names = [...set].sort((a, b) => (a || 9) - (b || 9)).map(l => l ? (l === 7 ? '7–9' : l) : 'other');
  return { id: 'bank', name: set.size ? `Word bank · HSK ${names.join(', ')}` : 'Word bank', accent: ACCENTS[0], cards };
}

/* Shi Shi pops up to cheer: springs out of the bottom bar with a squash, two happy hops, a speech bubble and
   paper confetti from behind his mane, then drops back after about 3 s. Tap him to send him away early. */
let cheerImg = null;
function cheer(n, say) {   // say: { zh, py, en } to replace the words-added message
  $('#cheer')?.remove();
  const dock = $('.dock'), b = dock ? Math.max(0, innerHeight - dock.getBoundingClientRect().top) : 90;
  const [zh, py] = say ? [say.zh, say.py] : n >= 20 ? ['太棒了！', 'tài bàng le'] : n >= 5 ? ['真棒！', 'zhēn bàng'] : ['很好！', 'hěn hǎo'];
  const el = document.createElement('div'); el.id = 'cheer'; el.style.setProperty('--cheer-b', b + 'px');
  el.innerHTML = `<div class="cheer-bubble" role="status"><div class="cheer-zh">${zh}</div><div class="cheer-py">${py}</div>
    <div class="cheer-en">${say ? say.en : `+${plural(n, 'word')} in your word bank`}</div></div><img class="cheer-lion" src="mascots/shi-shi.svg" alt="Shi Shi the lion cheering">`;
  document.body.appendChild(el);
  const lion = el.querySelector('.cheer-lion'), bub = el.querySelector('.cheer-bubble');
  let gone = false;
  const leave = fast => { if (gone) return; gone = true; el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: fast ? 160 : 1, fill: 'forwards' }).onfinish = () => el.remove(); };
  lion.onclick = () => leave(true);
  try { navigator.vibrate?.([10, 70, 16]); } catch (_) {}
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    lion.style.transform = 'none'; bub.style.opacity = 1;
    el.animate([{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 1, offset: .88 }, { opacity: 0 }], { duration: 2600, fill: 'both' }).onfinish = () => leave();
    return;
  }
  // up out of the bar: stretch while rising, squash on landing, settle
  lion.animate([
    { transform: 'translateY(105%) scale(.82)' },
    { transform: 'translateY(-12%) scale(.93,1.09)', offset: .48 },
    { transform: 'translateY(0) scale(1.09,.9)', offset: .7 },
    { transform: 'translateY(-3%) scale(.98,1.03)', offset: .86 },
    { transform: 'none' }], { duration: 720, easing: 'cubic-bezier(.25,.8,.35,1)', fill: 'forwards' });
  // two happy hops, leaning left then right
  lion.animate([
    { transform: 'none' },
    { transform: 'translateY(-13%) rotate(-6deg) scale(.97,1.04)', offset: .22 },
    { transform: 'translateY(0) scale(1.06,.94)', offset: .45 },
    { transform: 'none', offset: .5 },
    { transform: 'translateY(-13%) rotate(6deg) scale(.97,1.04)', offset: .72 },
    { transform: 'translateY(0) scale(1.06,.94)', offset: .95 },
    { transform: 'none' }], { duration: 820, delay: 900, easing: 'ease-in-out' });
  // back down into the bar
  lion.animate([
    { transform: 'none' },
    { transform: 'translateY(-7%) scale(.97,1.04)', offset: .3 },
    { transform: 'translateY(108%) scale(.9)' }], { duration: 430, delay: 2900, easing: 'cubic-bezier(.45,0,.8,.45)', fill: 'forwards' }).onfinish = () => leave();
  bub.animate([
    { opacity: 0, transform: 'scale(.3) translateY(12px)' },
    { opacity: 1, transform: 'scale(1.06)', offset: .6 },
    { opacity: 1, transform: 'none' }], { duration: 440, delay: 360, easing: 'cubic-bezier(.2,.9,.3,1.15)', fill: 'forwards' });
  bub.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.85) translateY(6px)' }], { duration: 220, delay: 2800, fill: 'forwards' });
  // paper confetti from behind his mane, falling back down behind the bar
  const colors = ['var(--seal)', '#E8B44A', 'var(--jade)', '#F6D682', '#E5483F'];
  for (let i = 0; i < 18; i++) {
    const bit = document.createElement('i'); bit.className = 'cheer-bit'; bit.style.background = colors[i % colors.length];
    if (i % 3 === 0) bit.style.borderRadius = '50%';
    el.insertBefore(bit, lion);
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.3, v = 95 + Math.random() * 95, dx = Math.cos(a) * v, dy = Math.sin(a) * v, r = (Math.random() < .5 ? -1 : 1) * (360 + Math.random() * 360);
    bit.animate([
      { transform: 'translate(0,0) rotate(0) scale(.4)', opacity: 0 },
      { transform: `translate(${dx * .65}px,${dy * .65}px) rotate(${r / 3}deg) scale(1)`, opacity: 1, offset: .28 },
      { transform: `translate(${dx}px,${dy + 230}px) rotate(${r}deg) scale(.8)`, opacity: 0 }],
      { duration: 1300 + Math.random() * 450, delay: 300 + Math.random() * 90, easing: 'cubic-bezier(.2,.65,.45,1)', fill: 'forwards' });
  }
}
function mountHsk() {
  if (!cheerImg) { cheerImg = new Image(); cheerImg.src = 'mascots/shi-shi.svg'; }   // ready before the first cheer
  S.hskIO?.disconnect();
  const H = S.H, lv = S.hskLevel;
  if (!H) { loadHsk().then(() => { if (S.view === 'hsk') render(); }, () => { const p = $('#hskLoad'); if (p) p.textContent = 'Could not load the HSK lists. Check your connection and open this page again.'; }); return; }
  if (!lv) return;
  const L = H.levels[lv] || [], sel = S.hskSel, list = $('#hskList'), addB = $('#hskAdd'), allB = $('#hskAll'), q = $('#hskQ');
  const inBank = new Set(db.bank.map(w => w.hanzi));
  let rows = L, shown = 0;
  const row = r => `<button class="row word ${inBank.has(r.h) ? 'has' : sel.has(r.h) ? 'on' : ''}" style="--sep:52px" data-h="${esc(r.h)}"><span class="sel">${I.check}</span><span class="hz">${esc(r.h)}</span>
    <span class="row-main"><span class="wp">${esc(r.p)}</span><span class="we">${esc(r.s ??= shortMeaning(r.e))}</span></span></button>`;
  const more = () => { if (shown >= rows.length) return; list.insertAdjacentHTML('beforeend', rows.slice(shown, shown + 150).map(row).join('')); shown += 150; };
  const fresh = () => rows.filter(r => !inBank.has(r.h));
  const paint = () => {
    addB.disabled = !sel.size; addB.textContent = sel.size ? `Add ${plural(sel.size, 'word')}` : 'Add to word bank';
    const f = fresh(); allB.disabled = !f.length; allB.style.opacity = f.length ? '' : '.35';
    allB.textContent = f.length && f.every(r => sel.has(r.h)) ? 'Deselect all' : 'Select all';
  };
  const reset = () => { list.innerHTML = rows.length ? '' : '<div class="row"><span class="row-s">No word in this level matches.</span></div>'; shown = 0; more(); paint(); };
  q.oninput = () => {
    const s = q.value.trim().toLowerCase(), sp = normPy(s);
    rows = !s ? L : L.filter(r => r.h.includes(s) || (sp && (r.np ??= normPy(r.p)).includes(sp)) || r.e.toLowerCase().includes(s));
    reset();
  };
  wireSearch(q, () => q.oninput());
  list.onclick = e => {
    const b = e.target.closest('.row[data-h]'); if (!b) return; const h = b.dataset.h;
    if (b.classList.contains('has')) { toast(`${h} is already in your word bank`); return; }
    sel.has(h) ? sel.delete(h) : sel.add(h); b.classList.toggle('on', sel.has(h)); paint();
  };
  allB.onclick = () => {
    const f = fresh(), all = f.every(r => sel.has(r.h)); f.forEach(r => all ? sel.delete(r.h) : sel.add(r.h));
    $$('.row[data-h]:not(.has)', list).forEach(b => b.classList.toggle('on', sel.has(b.dataset.h))); paint();
  };
  addB.onclick = () => {
    const now = Date.now();
    const words = L.filter(r => sel.has(r.h) && !inBank.has(r.h)).map((r, i) => ({ id: uid(), hanzi: r.h, pinyin: r.p, en: r.s ??= shortMeaning(r.e), added: now - i, hsk: r.lv }));
    if (!words.length) return;
    db.bank = [...words, ...db.bank]; save();
    words.forEach(w => inBank.add(w.hanzi)); sel.clear();
    $$('.row.on', list).forEach(b => { b.classList.remove('on'); b.classList.add('has'); });
    $('#hskHave').textContent = L.filter(r => inBank.has(r.h)).length;
    LOG.add('hsk-add', { level: HSK_NAME(lv), words: words.length });
    cheer(words.length); paint();
  };
  S.hskIO = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, { rootMargin: '800px' });
  S.hskIO.observe($('#hskMore'));
  reset();
}

/* ---------- install + updates ---------- */
// For every release: raise APP_VERSION here AND "version" in version.json (same number).
const APP_VERSION = '1.37';
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { installEvt = null; toast('ShiCards is on your home screen'); });
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isNewer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };
async function fetchLatest() { const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function applyUpdate() {
  toast('Updating…');
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (_) {}
  try { for (const k of await caches.keys()) { const c = await caches.open(k); for (const q of await c.keys()) if (new URL(q.url).origin === location.origin) await c.delete(q); } } catch (_) {}
  try { await Promise.all(['./', 'index.html', 'manifest.webmanifest'].map(u => fetch(u, { cache: 'reload' }))); } catch (_) {}
  location.reload();
}
function installHelp() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    ? ['Tap the <b>Share</b> button (a square with an arrow). In Safari it’s at the bottom, in Chrome at the top right.', 'Scroll down and tap <b>Add to Home Screen</b>.', 'Tap <b>Add</b>.']

      boxes: res.map((r, i) => ({ ok: r.ok, strokes: (boxes[i]._strokes || []).length, rank: r.rank, top: r.cands?.[0], fit: r.shape?.fit != null ? +r.shape.fit.toFixed(2) : undefined, missing: r.shape?.missing || undefined, stray: r.shape?.stray || undefined, part: r.shape?.badPart?.pos,
        ink: r.ok === false && !r.empty ? { s: boxes[i]._s, strokes: (boxes[i]._strokes || []).map(st => st.filter((_, k) => k % 2 === 0 || k === st.length - 1).map(p => [Math.round(p.x), Math.round(p.y)])) } : undefined })),   // a failed drawing, so a wrong "wrong" can be replayed and fixed

/* ---------- swipe between pages ----------
   Decks, Learn and Profile sit side by side: drag left or right and the next page follows your finger.
   Inside a deck, drag right to slide back to all decks. Let go past 30% of the width, or flick, to switch. */
(function pageSwipe() {
  const app = $('#app'), EASE = 'cubic-bezier(.2,.8,.2,1)', BOUNCE = 'cubic-bezier(.3,1.45,.5,1)';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let g = null, noClickUntil = 0;
  const targets = () => {
    if (S.view === 'deck' || S.view === 'bank') return { tab: 0, prev: { tab: 0, html: () => Home(), go: () => { S.instant = S.toTop = true; goBack('#/'); } } };
    const order = ['home', 'learn', 'read', 'profile'], views = [Home, LearnView, ReadView, ProfileView], i = order.indexOf(S.view);
    if (i < 0) return null;
    const t = j => views[j] && { tab: j, html: views[j], go: () => { S.instant = true; nav(TABS[j][2]); } };
    return { tab: i, prev: t(i - 1), next: t(i + 1) };
  };
  const pill = () => $('#tabbar .tab-pill');
  const place = (x, dur, ease = EASE) => {
    const tr = dur ? `transform ${dur}ms ${ease}` : 'none';
    g.cur.style.transition = tr; g.cur.style.transform = `translateX(${x}px)`;
    for (const [p, side] of [[g.pp, -1], [g.np, 1]]) if (p) { p.style.transition = tr; p.style.transform = `translateX(${x + side * g.w}px)`; }
    const to = x < 0 ? g.T.next : g.T.prev, pos = to ? g.T.tab + (to.tab - g.T.tab) * Math.min(1, Math.abs(x) / g.w) : g.T.tab, pl = pill();
    if (pl) { pl.style.transition = tr; pl.style.transform = `translateX(calc(${pos} * var(--tabw)))`; }
  };
  const begin = () => {
    g.on = true; app.classList.add('swiping');
    try { app.setPointerCapture(g.id); } catch (_) {}
    g.cur = app.firstElementChild; g.cur.classList.remove('fade-in');
    const r = app.getBoundingClientRect(), top = app.scrollTop + Math.max(0, -r.top);
    const h = Math.min(innerHeight, r.bottom) - Math.max(0, r.top);
    g.w = app.clientWidth;
    const mk = t => { if (!t) return null; const p = document.createElement('div'); p.className = 'peek'; p.style.cssText = `top:${top}px;height:${h}px`;
      p.innerHTML = t.html(); p.firstElementChild?.classList.remove('fade-in'); app.appendChild(p); return p; };
    g.pp = mk(g.T.prev); g.np = mk(g.T.next);
  };
  const end = e => {
    if (!g || e.pointerId !== g.id) return; const G = g;
    if (!G.on) { g = null; return; }
    if (G.done) return; G.done = true;   // settling: ignore further moves until the slide finishes
    noClickUntil = performance.now() + 350;
    const to = G.x0 < 0 ? G.T.next : G.T.prev;
    const go = e.type === 'pointerup' && to && (Math.abs(G.x0) > G.w * 0.3 || (Math.abs(G.v) > 0.3 && Math.sign(G.v) === Math.sign(G.x0)));
    LOG.add('swipe', { dir: G.x0 < 0 ? 'left' : 'right', switched: !!go, dragged: Math.round(Math.abs(G.x0) / G.w * 100) + '%', speed: +G.v.toFixed(2), page: !to ? 'none that way' : undefined });
    const final = go ? Math.sign(G.x0) * G.w : 0, dur = reduce.matches ? 0 : go ? 260 : !to ? 520 : 220;
    place(final, dur || 1, !go && !to ? BOUNCE : EASE);   // first or last page: spring back with a little bounce
    setTimeout(() => {
      g = null; app.classList.remove('swiping');
      const pl = pill(); if (pl) pl.style.transition = '';
      if (go) { G.cur.style.visibility = 'hidden'; to.go(); return; }   // the new page renders in place of the peek
      G.pp?.remove(); G.np?.remove(); G.cur.style.transition = G.cur.style.transform = '';
    }, dur + 20);
  };
  app.addEventListener('pointerdown', e => {
    if (g || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('input,textarea,select,.stage,.tzg,canvas,.shelf')) return;
    const T = targets(); if (!T) return;
    g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, hist: [[e.clientX, e.timeStamp]], v: 0, x0: 0, T, on: false };
  });
  app.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id || g.done) return;
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if (!g.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { g = null; return; }   // up/down: normal scrolling
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      begin();
    }
    g.v = speed(g.hist, e.clientX, e.timeStamp);
    // first or last page, nothing that way: the page still follows your finger out to the far edge, then springs back on release
    const edge = (dx > 0 && !g.T.prev) || (dx < 0 && !g.T.next);
    g.x0 = edge ? Math.sign(dx) * Math.min(g.w, Math.abs(dx)) * 0.85 : Math.max(-g.w, Math.min(g.w, dx));
    place(g.x0, 0);
  });
  app.addEventListener('pointerup', end);
  app.addEventListener('pointercancel', end);
  // once the swipe is ours, stop the browser running its own (invisible) scroll for it;
  // otherwise Chrome treats the next tap as "stop scrolling" and the tap is lost
  app.addEventListener('touchmove', e => { if (g?.on && e.cancelable) e.preventDefault(); }, { passive: false });
  // a drag that ends over a button must not also press it
  document.addEventListener('click', e => { if (performance.now() < noClickUntil) { e.stopPropagation(); e.preventDefault(); LOG.blocked(); } }, true);
})();

/* ---------- pull to refresh ----------
   At the very top of a page, pull down: the page slides down and a red Chinese knot is lowered on its cord into the gap.
   Pull until the knot gives a little bounce, let go, and it swings while the app reloads (same as Chrome's refresh).
   Let go earlier and everything slides back. */
(() => {
  const app = $('#app'), box = $('#ptr');
  // a classic red knot kept simple: a woven diamond with six loops, a gold bead and a tassel
  box.innerHTML = `<div class="ptr-charm"><svg viewBox="-6 0 76 132">
    <defs>
      <linearGradient id="ptrSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3a0606" stop-opacity=".25"/></linearGradient>
      <linearGradient id="ptrGold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F2CF7A"/><stop offset="1" stop-color="#B9852C"/></linearGradient>
    </defs>
    <path d="M32 0V22" stroke="#B5161E" stroke-width="2.2"/>
    <circle cx="32" cy="10" r="4.2" fill="#C8202A" stroke="#7E0D13" stroke-width="1"/>
    <g transform="translate(32 50) rotate(45)">
      <g fill="none" stroke="#C8202A" stroke-width="3.6">
        <circle cx="0" cy="-21.5" r="4.6"/><circle cx="21.5" cy="0" r="4.6"/><circle cx="0" cy="21.5" r="4.6"/><circle cx="-21.5" cy="0" r="4.6"/>
        <circle cx="-21" cy="21" r="5"/><circle cx="21" cy="-21" r="5"/>
      </g>
      <g fill="none" stroke="#7E0D13" stroke-width=".8" opacity=".6">
        <circle cx="0" cy="-21.5" r="6.4"/><circle cx="21.5" cy="0" r="6.4"/><circle cx="0" cy="21.5" r="6.4"/><circle cx="-21.5" cy="0" r="6.4"/>
        <circle cx="-21" cy="21" r="6.8"/><circle cx="21" cy="-21" r="6.8"/>
      </g>
      <rect x="-17.5" y="-17.5" width="35" height="35" rx="3.5" fill="#C8202A"/>
      <path d="M-17 0H17M0 -17V17" stroke="#7E0D13" stroke-width="1.2"/>
      <path d="M-17 -1.5H17M-1.5 -17V17" stroke="#E8505A" stroke-width=".8" opacity=".9"/>
      <rect x="-17.5" y="-17.5" width="35" height="35" rx="3.5" fill="url(#ptrSheen)" stroke="#7E0D13" stroke-width="1"/>
    </g>
    <path d="M32 74V84" stroke="#B5161E" stroke-width="2.2"/>
    <circle cx="32" cy="84" r="4.6" fill="url(#ptrGold)" stroke="#8E6420" stroke-width=".8"/>
    <path d="M27 91C26 104 21 116 19 128Q32 132 45 128C43 116 38 104 37 91Z" fill="#C8202A"/>
    <path d="M30 93C29 106 26 118 25 129M34 93C35 106 38 118 39 129M32 93V130" stroke="#7E0D13" stroke-width=".7" fill="none"/>
    <path d="M27 91C26 104 21 116 19 128Q32 132 45 128C43 116 38 104 37 91Z" fill="url(#ptrSheen)"/>
    <rect x="26" y="89" width="12" height="6" rx="1.6" fill="url(#ptrGold)" stroke="#8E6420" stroke-width=".7"/>
  </svg></div>`;
  const charm = box.firstElementChild, EASE = 'cubic-bezier(.2,.8,.2,1)', reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const ARM = 100, HOLD = 104;   // how far the page has to come down (px) before letting go reloads; where it rests while reloading
  let t = null, busy = false, inset = 0, kh = 90;   // kh: the knot's height, measured once per pull
  const atTop = () => (document.scrollingElement?.scrollTop || 0) <= 0 && app.scrollTop <= 0;
  const blocked = el => $('#sheet-root').classList.contains('open') || el.closest?.('input,textarea,select,.stage,.tzg,canvas,.shelf,#tabbar,#rec,#drawer-root');
  const topInset = () => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top);visibility:hidden'; document.body.append(d); const h = d.offsetHeight; d.remove(); return h; };
  const pull = d => 200 * (1 - Math.exp(-Math.max(0, d) / 240));   // follows the finger at first, then gets heavier
  const place = (p, dur, curve = EASE) => {
    const tr = dur ? `transform ${dur}ms ${curve}, opacity ${dur}ms` : 'none';
    app.style.transition = charm.style.transition = tr;
    app.style.transform = p ? `translate3d(0,${p}px,0)` : '';
    // the knot's bottom hangs just above the page, under the status bar area
    charm.style.transform = `translate3d(0,${inset + p - 6 - kh}px,0)`;
    charm.style.opacity = Math.min(1, p / 36);
  };
  const reset = () => { app.style.transition = app.style.transform = charm.style.transition = charm.style.transform = charm.style.opacity = box.style.rotate = ''; box.classList.remove('armed', 'swing'); };
  const release = ok => {
    const T = t; t = null; if (!T?.on) return;
    if (ok && T.armed) {
      busy = true; LOG.add('pull-refresh', {});
      place(HOLD, 260);
      box.style.transition = 'rotate .3s'; box.style.rotate = '';
      if (!reduce.matches) setTimeout(() => box.classList.add('swing'), 200);
      setTimeout(() => location.reload(), 750);

    setTimeout(() => { if (!t && !busy) reset(); }, 340);
  };
  document.addEventListener('touchstart', e => {
    if (busy || t?.on || e.touches.length !== 1 || blocked(e.target) || !atTop()) { if (!t?.on) t = null; return; }

  document.addEventListener('touchcancel', () => release(false));
})();

for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });

if (window.visualViewport) {

/* re-layout tianzige on rotation */
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'write' && !S.write?.done && !S.write?.revealed && !S.write?.history?.length) render(); }, 200); });

history.replaceState({ d: 0 }, '', location.hash || '#/');
LOG.add('open', deviceInfo()); paintRec();
