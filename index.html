          const x = cands._list?.[i]; if (!x) return;
          LOG.add('qa-pinyin-pick', { typed: normPy(inp.value), picked: x.h, choice: i + 1 });
          setWord(Q.word + x.h, null, (Q.word ? Q.typed : '') + normPy(inp.value).slice(0, x.len)); inp.value = normPy(inp.value).slice(x.len); lookup(); inp.focus();
        };

        cands.onclick = e => { const b = e.target.closest('.cand'); if (b) pick(+b.dataset.i); };
        inp.addEventListener('input', () => {
          const han = hanChars(inp.value).join('');

      },

        const inp = $q('#qaIn'), res = $q('#qaR'); let t;

        };

        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); run(); } });
        res.onclick = e => {
          const b = e.target.closest('.en-row'); if (!b) return; const row = res._rows[+b.dataset.i];
          LOG.add('qa-english-pick', { typed: inp.value.trim(), picked: row.h, choice: +b.dataset.i + 1 });
          setWord(row.h, row); inp.blur();

        };
        Q.reset = () => { inp.value = ''; run(); };
        setTimeout(() => inp.focus(), 250);
      },
    };
    const setMode = m => {
      Q.mode = m; db.prefs.qaMode = m; save(); Q.seq++;
      $q('#qaSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
      modes[m](); paintWord();
    };
    $q('#qaSeg').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.m !== Q.mode) setMode(b.dataset.m); };

    addBtn.onclick = () => {
      const hz = Q.word, en = enEl.value.trim(), pinyin = curPinyin();
      if (!hanChars(hz).length || !isWord()) return;
      if (sel.size && !en) { enEl.focus(); toast('Add a meaning — it goes on the back of the card'); return; }
      let w = bankHas(hz); const isNew = !w;
      if (isNew) { w = { id: uid(), hanzi: hz, pinyin, en, added: Date.now(), hsk: S.H ? S.H.byHz.get(hz)?.lv || 0 : undefined }; db.bank.unshift(w); }

      save();
      LOG.add('quick-add', { hz, pinyin, en, via: Q.mode, new_in_bank: isNew, decks: into.map(d => d.name) });
      toast(`${isNew ? `Added ${hz} to your word bank` : `${hz} is already in your word bank`}${into.length ? ` · ${into.length === 1 ? into[0].name : plural(into.length, 'deck')}` : ''}`);
      setWord(''); Q.reset?.(); render();
    };
    setMode(Q.mode);
    loadDict().then(D => { Q.D = D; paintWord(); }).catch(() => { Q.dictErr = true; paintButton(); });
    if (!S.H) loadHsk().then(paintWord, () => {});
  });
}

/* search field with a magnifier and a clear button; onClear runs after the text is wiped */
const searchField = (id, ph) => `<label class="search">${I.search}<input id="${id}" type="search" placeholder="${ph}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button type="button" class="clr" hidden aria-label="Clear">${I.close}</button></label>`;
function wireSearch(inp, onClear) {
  const clr = inp.parentElement.querySelector('.clr');
  inp.addEventListener('input', () => { clr.hidden = !inp.value; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });

/* ---------- HSK lists ----------
   dict/hsk.tsv: the HSK 3.0 word lists of the 2026 syllabus (levels 1-6, and 7 for the 7-9 band), from
   complete-hsk-vocabulary (MIT) with CC-CEDICT meanings; rebuild with tools/build_hsk.py.
   One line per word: level <TAB> simplified <TAB> pinyin <TAB> meanings. */
const HSK_NAME = l => l === 7 ? 'HSK 7–9' : 'HSK ' + l;
const HSK_COUNT = { 1: 294, 2: 197, 3: 487, 4: 972, 5: 1547, 6: 1684, 7: 4876 };   // words per level, shown before the lists load
/* the shelf of HSK levels on the Decks page; rings fill in once the lists are loaded */
function HskShelf() {
  const inBank = S.H && new Set(db.bank.map(w => w.hanzi));
  return `<div class="shelf" id="hskShelf">${[1, 2, 3, 4, 5, 6, 7].map(l => {
    const L = S.H?.levels[l], n = L ? L.length : HSK_COUNT[l], k = L ? L.filter(r => inBank.has(r.h)).length : 0;
    return `<button class="shelf-tile" data-act="hsk-level" data-lv="${l}">${ring(l === 7 ? '7–9' : String(l), n ? k / n : 0)}
      <span class="shelf-t">${HSK_NAME(l)}</span><span class="shelf-s">${k ? `${k.toLocaleString('en')} of ${n.toLocaleString('en')}` : `${n.toLocaleString('en')} words`}</span></button>`;
  }).join('')}</div>`;
}
let hskP = null;
function loadHsk() {
  const gloss = fetch('dict/gloss.tsv').then(r => r.ok ? r.text() : '', () => '');   // clear single-character meanings (writing practice); optional
  return hskP ||= Promise.all([fetch('dict/hsk.tsv').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }), gloss]).then(([t, g]) => {
    const levels = {}, byHz = new Map(), gl = new Map();
    for (const l of t.split('\n')) {
      if (!l || l[0] === '#') continue;
      const [lv, h, p, e] = l.split('\t'); if (!h) continue;
      const row = { lv: +lv, h, p, e: e || '' };
      (levels[row.lv] ||= []).push(row); if (!byHz.has(h)) byHz.set(h, row);
    }
    for (const l of g.split('\n')) { const [h, p, en] = l.replace(/\r$/, '').split('\t'); if (h && h[0] !== '#' && en) gl.set(h, { p, en }); }
    // "erhua variant of 小孩; child": the sense after it, else the plain word's meanings. Hand-written meanings win, and a word-bank
    // card still showing the old dictionary meaning (小朋友 "child", 在 "to exist") takes the new one.
    const was = new Map();
    for (const r of byHz.values()) {
      const m = /^erhua variant of ([^;\s]+)(?:; (.+))?$/.exec(r.e); if (!m && !gl.has(r.h)) continue;
      was.set(r.h, shortMeaning(r.e));
      if (m) r.e = m[2] || byHz.get(m[1])?.e || r.e;
      if (gl.has(r.h)) r.s = gl.get(r.h).en;
    }
    let fixed = false;
    for (const w of db.bank) { const r = byHz.get(w.hanzi); if (r && was.has(w.hanzi) && w.en === was.get(w.hanzi) && w.en !== meanOf(r)) { w.en = meanOf(r); fixed = true; } }
    if (fixed) save();
    S.H = { levels, byHz, gloss: gl }; tagBank(); return S.H;
  }).catch(e => { hskP = null; throw e; });
}
/* What a single character is asked as in writing practice. The HSK list's first dictionary sense is often a rare one
   (长 "chief; head", 年 "grain; harvest (old)"), so: the hand-written meaning from dict/gloss.tsv when there is one,
   else the dictionary meanings without abbreviations, radical names, slang and old senses. */
const ODD_SENSE = /^(abbr|Kangxi|surname|variant|old variant|used in|see |\((coll|slang|literary|old|dialect|Tw|Taiwan|Cantonese|archaic|loanword|physics|math|chemistry)[^)]*\))|radical/i;
function writeAsk(c) {
  const chs = hanChars(c.hanzi); if (chs.length !== 1 || !S.H) return { en: c.en, py: c.pinyin };
  const g = S.H.gloss?.get(c.hanzi); if (g) return { en: g.en, py: g.p || c.pinyin };
  const row = S.H.byHz.get(c.hanzi); if (!row || c.en !== meanOf(row)) return { en: c.en, py: c.pinyin };   // a meaning you typed yourself stays
  const ok = row.e.split('; ').filter(m => !ODD_SENSE.test(m) && !/^[A-Z][a-z]/.test(m)).join('; ');
  return { en: (ok && shortMeaning(ok)) || c.en, py: c.pinyin };
}
/* a common word that uses the character, shown with the character left out (东＿ · thing): which sense is meant,
   without giving the answer. Words from your word bank first, then the easiest HSK level. */
function writeClue(c) {
  const ch = c.hanzi; if (hanChars(ch).length !== 1 || !S.H) return null;
  const mine = new Set(db.bank.map(w => w.hanzi)), say = normPy(writeAsk(c).py || ''); let best = null, bs = Infinity;
  for (const lv of [1, 2, 3, 4, 5, 6, 7]) for (const [k, r] of (S.H.levels[lv] || []).entries()) {
    if (r.h === ch || !r.h.includes(ch) || [...r.h].length > 3 || !r.e) continue;
    if (say && normPy(r.p.split(' ')[[...r.h].indexOf(ch)] || '') !== say) continue;   // same reading only: "long" 长 cháng, not 校长 zhǎng
    const sc = (mine.has(r.h) ? 0 : 1e5) + lv * 1e4 + k; if (sc < bs) { bs = sc; best = r; }
  }
  return best && { hz: best.h, py: best.p, en: meanOf(best) };
}
/* ---------- character parts ----------
   dict/parts.tsv (Make Me a Hanzi; rebuild with tools/build_parts.py): how each character is put together (⿰ left/right,

function bindSettings(sh, dr) {

    catch (_) { toast('That file isn’t a ShiCards backup'); }
  };
}

/* ---------- actions ---------- */
/* =========================================================
   Proven patterns from top learning apps (evidence and sources: proven-patterns.html)
   - Onboarding: value first (a real mini lesson, no account, no slide tour), why / level / daily goal you pick yourself,
     a "Commit to my goal" button, then a reminder or home-screen step after the first win.
   - Streak moments: streak saved by a freeze, milestones, welcome back after a break, a free way to win a lost streak back.
   - Daily goal kept apart from the streak: one round keeps the streak, the goal is extra.
   - Badges for real skills, the app icon's dot, and a paywall layout kept as a preview (nothing is sold).
   ========================================================= */
function layer(html, cls = '') {   // a full-screen page over the app
  $('#ob')?.remove();
  const el = document.createElement('div'); el.id = 'ob'; if (cls) el.className = cls;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="ob-in">${html}</div>`; $('#frame').appendChild(el); return el;
}
function closeLayer(then) {
  const el = $('#ob'); if (!el) { then?.(); return; }
  el.id = ''; el.classList.add('out');
  setTimeout(() => { el.remove(); then?.(); }, stillMotion() ? 0 : 200);
}
const confetti = () => Array.from({ length: 22 }, (_, i) => `<i style="--x:${(i % 2 ? 1 : -1) * (40 + (i * 37) % 120)}px;--y:${-(60 + (i * 53) % 110)}px;--r:${(i * 97) % 360}deg;--d:${(i % 7) * 40}ms;background:${['#E5483F', '#FFD15C', '#3F7A5F', '#E8742C', '#B23A2C'][i % 5]}"></i>`).join('');

/* ---------- daily goal: minutes of real practice a day ----------
   A practice page (flip cards, writing, a story, Hanzi of the day, the first lesson) counts while it is on screen
   and you touched it in the last minute, in 5-second steps, kept per day in db.days[day].sec.
   A bigger goal also brings more new words each day, so it really does get you to the next level sooner. */
const GOALS = [[5, 'Casual'], [10, 'Regular'], [15, 'Serious'], [20, 'Intense']];
const newPerDay = () => db.prefs.goalMin ? Math.max(2, Math.round(db.prefs.goalMin * .4)) : NEW_PER_DAY;
let actT = 0;
['pointerdown', 'keydown'].forEach(t => addEventListener(t, () => { actT = Date.now(); }, { capture: true, passive: true }));
const practising = () => S.view === 'study' || S.view === 'write' || S.view === 'lesson' || !!$('.story') || !!$('.hdx') || !!(S.ob && ['check', 'words', 'read'].includes(OB_STEPS[S.ob.i]));
setInterval(() => {
  if (document.hidden || Date.now() - actT > 6e4 || !practising()) return;
  const d = db.days[dayKey(Date.now())] ||= { decks: {} }; d.sec = (d.sec || 0) + 5;
  if (d.sec % 30 === 0) save();
}, 5000);
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
function goalToday() {
  return { min: Math.round((db.days[dayKey(Date.now())]?.sec || 0) / 60), goal: db.prefs.goalMin || 0 };
}
function GoalRow(act = 'goal') {
  const { min, goal } = goalToday();
  if (!goal) return `<button class="goal-row" data-act="${act}"><span class="goal-main"><b>Set a daily goal</b><small>How many minutes a day you want to practise</small></span><span class="goal-ch">Set</span></button>`;
  const f = Math.min(1, min / goal);
  return `<button class="goal-row" data-act="${act}"><span class="goal-main"><b>${f >= 1 ? 'Daily goal reached ✓' : 'Daily goal'}</b>
    <small>${Math.min(min, goal)} of ${goal} min today</small><span class="goal-bar"><i style="width:${Math.round(f * 100)}%"></i></span></span><span class="goal-ch">Change</span></button>`;
}
/* how long until the next level at each goal: words still to learn at that level / new words a day */
function goalPace(lv, left) {
  return GOALS.map(([m]) => { const per = Math.max(2, Math.round(m * .4)); return { m, per, weeks: Math.max(1, Math.round(left / per / 7)) }; });
}
function GoalOpts(cur, lv, left) {
  const P = goalPace(lv, left), fast = Math.max(...P.map(p => p.per));
  return GOALS.map(([m, t], i) => `<button class="ob-opt ob-gopt" data-v="${m}" data-g="${m}" aria-pressed="${m === cur}">
      <span class="gopt-min"><b>${m}</b><small>min</small></span>
      <span class="ob-txt"><b>${t}</b><span class="gopt-bar" aria-hidden="true"><i style="width:${Math.round(P[i].per / fast * 100)}%"></i></span></span>
      <span class="gopt-when"><small>${HSK_NAME(lv)} done in</small><b>~${plural(P[i].weeks, 'week')}</b></span></button>`).join('');
}
function goalLevel() {   // the level you're working on now and how many of its words you don't know yet
  const lv = Math.min(7, db.prefs.level || 1), L = S.H?.levels[lv], k = knownWords();
  return { lv, left: L ? L.filter(r => !k.has(r.h)).length : HSK_COUNT[lv] };
}
function goalSheet() {
  const cur = db.prefs.goalMin || 0, { lv, left } = goalLevel();
  openSheet(`<h3>Daily goal</h3><p class="muted" style="margin:-6px 0 16px;text-align:center">More minutes a day means more new words a day, so you finish your level sooner.</p>
    <div class="ob-opts" id="gOpts">${GoalOpts(cur, lv, left)}</div>
    <button class="btn btn-primary wide" id="gGo" style="margin-top:18px"${cur ? '' : ' disabled'}>Commit to my goal</button>`, sh => {
    let pick = cur;
    sh.querySelector('#gOpts').onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; pick = +b.dataset.g;
      sh.querySelectorAll('.ob-opt').forEach(x => x.setAttribute('aria-pressed', x === b)); sh.querySelector('#gGo').disabled = false; };
    sh.querySelector('#gGo').onclick = () => { db.prefs.goalMin = pick; save(); LOG.add('goal', { min: pick }); closeSheet(); toast(`Daily goal: ${pick} minutes`); setTimeout(render, 250); };
  });
}

    if (step === 'check') O.chk = null;   // backing out of the check: it starts over next time
    if (step === 'words') O.q = null;
    if (step === 'read') O.st = null;
    if (to === 'check' && O.chk) { delete O.chk.est; delete O.chk.res[O.chk.rounds.at(-1).lv]; O.q = null; O.st = null; }   // back on its last round
    if (to === 'words' && O.q) { O.q.cards.at(-1).pick = null; O.st = null; }   // back on the last card
    if (to === 'read' && O.st) O.st.pick = null;
    O.i = OB_STEPS.indexOf(to); obShow(); return;
  }
  if (a === 'remind') { const h = +$('#obHr .chip.on')?.dataset.h || 19; await remindSet(true, h); obFinish('reminder'); return; }
  if (a === 'install') {
    if (installEvt) { installEvt.prompt(); const { outcome } = await installEvt.userChoice; installEvt = null; LOG.add('install', { outcome, from: 'onboarding' }); obFinish('install-' + outcome); }
    else { obFinish('install-help'); setTimeout(installHelp, 350); }
    return;
  }
  html = html.replace(/[–—]/g, '-');   // short dashes only on these pages (HSK 7-9, HSK 1-2)
  // next
  if (step === 'check') {
    if (!O.chk) return;
  if (step === 'placed') obReel(el);
    const R = O.chk.rounds.at(-1); LOG.add('onboarding-check', { lv: R.lv, known: R.on.size, of: R.chars.length });
    if (obPlace()) { LOG.add('onboarding-placed', O.chk.est); O.q = null; O.st = null; obGo(obSkipTests() ? 'placed' : 'words'); } else obShow();
/* count the level up one number at a time: quick ticks first, the last ones slower, every number landing whole */
function obReel(el) {
  const r = el.querySelector('.ob-reel-in'), n = +r?.dataset.to; if (!n || stillMotion()) return;
  let t = 520;
  for (let k = 1; k <= n; k++) {
    const left = n - k, gap = left === 0 ? 330 : left === 1 ? 240 : 150;
    t += gap;
    setTimeout(() => { if (!r.isConnected) return; r.style.setProperty('--d', (left ? .14 : .32) + 's'); r.style.setProperty('--p', k);
      if (!left) setTimeout(() => r.closest('.ob-hsk')?.classList.add('landed'), 200); }, t);
  }
}
    return;
  }
  if (step === 'goal') { if (canRemind() || !isInstalled()) obGo('habit'); else obFinish('done'); return; }
  obGo(OB_STEPS[O.i + 1]);
}

function runEnding(d) {   // how many practice days in a row ended on day d (freeze days bridge but don't count)

/* called after a main page is drawn: shows at most one moment, the most important first */
function moments() {
  if ($('#ob') || S.ob || $('#sheet-root.open') || !db.prefs.ob && FRESH) return;

  if (db.earnDone) { const m = db.earnDone; db.earnDone = null; save(); LOG.add('moment', { what: 'earned-back', n: m }); return momentEarned(m); }
  if (F.saved) { const s = F.saved; F.saved = null; save(); LOG.add('moment', { what: 'saved', ...s }); return momentSaved(s); }
  if (today && MILES.includes(n) && db.mile !== n) { db.mile = n; save(); LOG.add('moment', { what: 'milestone', n }); return momentMile(n); }
  const tk = dayKey(Date.now()), last = lastPractice();
  if (!today && last && db.back !== tk) {

    if (away >= 3) {

/* win a lost streak back: practise 3 days in a row before the week is out; the gap is then covered like freeze days */
function earnBack(n, runStart) {
  const E = db.earn; if (!E) return false;
  if (Date.now() > E.until) { db.earn = null; save(); return false; }
  if (n < 3 || !runStart) return false;
  const x = new Date(E.from); x.setDate(x.getDate() + 1);
  for (let i = 0; i < 30 && dayKey(x) !== dayKey(runStart); i++, x.setDate(x.getDate() + 1)) db.freeze.days.push(dayKey(x));
  db.earn = null; save(); LOG.add('earn-back', { lost: E.n });
  return true;
}

/* ---------- badges: real skills, each with its progress ---------- */
function bestStreak() {
  const act = practiceDays(), ice = new Set(db.freeze.days), keys = [...act].map(k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m, d).getTime(); }).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const t of keys) {
    if (prev != null) { const x = new Date(prev); x.setDate(x.getDate() + 1); let ok = true;
      while (dayKey(x) !== dayKey(t)) { if (!ice.has(dayKey(x))) { ok = false; break; } x.setDate(x.getDate() + 1); }
      run = ok ? run + 1 : 1; } else run = 1;
    best = Math.max(best, run); prev = t;
  }
  return best;
}

        ink: r.ok === false && !r.empty ? { s: boxes[i]._s, strokes: (boxes[i]._strokes || []).map(st => st.filter((_, k) => k % 2 === 0 || k === st.length - 1).map(p => [Math.round(p.x), Math.round(p.y)])) } : undefined })),   // a failed drawing, so a wrong "wrong" can be replayed and fixed
      said: judgeNote(chars).replace(/<[^>]+>/g, '') });
    showVerdict();
  },
  'outline': t => {
    db.prefs.outline = !db.prefs.outline; save(); t.classList.toggle('on', db.prefs.outline);
    S.write.writers.forEach(w => db.prefs.outline ? w.showOutline() : w.hideOutline());
  },
  'giveup': () => {
    const W = S.write; W.mistakes += 99;
    W.writers.forEach((w, i) => { try { w.cancelQuiz(); } catch (_) {} setTimeout(() => w.animateCharacter(), i * 600); });
    finishGuided(true);
  },
  'skip': () => { S.write.sounded = true; gradeWrite(false); },   // skipping is not a wrong answer: no buzz
  'grade': t => gradeWrite(t.dataset.ok === '1'),
  'retry-missed': () => { const W = S.write; startWrite(W.order.slice(0, W.main).filter(id => !W.results[id])); render(); },
  'write-again': () => { startWrite(shuffle(S.write.order.slice(0, S.write.main))); render(); },
  'write-next': () => { startWrite(writePick(curDeck())); render(); },   // word bank: the next N (the ones just written right go to the back)
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  A[t.dataset.act]?.(t, e);
});

/* ---------- swipe between pages ----------
   Decks, Learn and Profile sit side by side: drag left or right and the next page follows your finger.
   Inside a deck, drag right to slide back to all decks. Let go past 30% of the width, or flick, to switch. */
(function pageSwipe() {
  const app = $('#app'), EASE = 'cubic-bezier(.2,.8,.2,1)';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let g = null, noClickUntil = 0;
  const targets = () => {
    if (S.view === 'deck' || S.view === 'bank') return { tab: 0, prev: { tab: 0, html: () => Home(), go: () => { S.instant = S.toTop = true; goBack('#/'); } } };
    const order = ['home', 'learn', 'read', 'profile'], views = [Home, LearnView, ReadView, ProfileView], i = order.indexOf(S.view);
    if (i < 0) return null;
    const t = j => views[j] && { tab: j, html: views[j], go: () => { S.instant = true; nav(TABS[j][2]); } };
    return { tab: i, prev: t(i - 1), next: t(i + 1) };
  };
  const pill = () => $('#tabbar .tab-pill');
  const place = (x, dur, ease = EASE) => {
    const tr = dur ? `transform ${dur}ms ${ease}` : 'none';
    g.cur.style.transition = tr; g.cur.style.transform = `translateX(${x}px)`;
    for (const [p, side] of [[g.pp, -1], [g.np, 1]]) if (p) { p.style.transition = tr; p.style.transform = `translateX(${x + side * g.w}px)`; }
    const to = x < 0 ? g.T.next : g.T.prev, pos = to ? g.T.tab + (to.tab - g.T.tab) * Math.min(1, Math.abs(x) / g.w) : g.T.tab, pl = pill();
    if (pl) { pl.style.transition = tr; pl.style.transform = `translateX(calc(${pos} * var(--tabw)))`; }
  };
  const begin = () => {
    g.on = true; app.classList.add('swiping');
    try { app.setPointerCapture(g.id); } catch (_) {}
    g.cur = app.firstElementChild; g.cur.classList.remove('fade-in');
    const r = app.getBoundingClientRect(), top = app.scrollTop + Math.max(0, -r.top);
    const h = Math.min(innerHeight, r.bottom) - Math.max(0, r.top);
    g.w = app.clientWidth;
    const mk = t => { if (!t) return null; const p = document.createElement('div'); p.className = 'peek'; p.style.cssText = `top:${top}px;height:${h}px`;
      p.innerHTML = t.html(); p.firstElementChild?.classList.remove('fade-in'); app.appendChild(p); return p; };
    g.pp = mk(g.T.prev); g.np = mk(g.T.next);
  };
  const end = e => {
    if (!g || e.pointerId !== g.id) return; const G = g;
    if (!G.on) { g = null; return; }
    if (G.done) return; G.done = true;   // settling: ignore further moves until the slide finishes
    noClickUntil = performance.now() + 350;
    const to = G.x0 < 0 ? G.T.next : G.T.prev;
    const go = e.type === 'pointerup' && to && (Math.abs(G.x0) > G.w * 0.3 || (Math.abs(G.v) > 0.3 && Math.sign(G.v) === Math.sign(G.x0)));
    LOG.add('swipe', { dir: G.x0 < 0 ? 'left' : 'right', switched: !!go, dragged: Math.round(Math.abs(G.x0) / G.w * 100) + '%', speed: +G.v.toFixed(2), page: !to ? 'none that way' : undefined });
    const final = go ? Math.sign(G.x0) * G.w : 0, dur = reduce.matches || (!go && !G.x0) ? 0 : go ? 260 : 220;
    place(final, dur || 1);
    setTimeout(() => {
      g = null; app.classList.remove('swiping');
      const pl = pill(); if (pl) pl.style.transition = '';
      if (go) { G.cur.style.visibility = 'hidden'; to.go(); return; }   // the new page renders in place of the peek
      G.pp?.remove(); G.np?.remove(); G.cur.style.transition = G.cur.style.transform = '';
    }, dur + 20);
  };
  app.addEventListener('pointerdown', e => {
    if (g || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('input,textarea,select,.stage,.tzg,canvas,.shelf,.hd-stack')) return;
    const T = targets(); if (!T) return;
    g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, hist: [[e.clientX, e.timeStamp]], v: 0, x0: 0, T, on: false };
  });
  app.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id || g.done) return;
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if (!g.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { g = null; return; }   // up/down: normal scrolling
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      begin();
    }
    g.v = speed(g.hist, e.clientX, e.timeStamp);
    // first or last page, nothing that way: the page stays still
    const edge = (dx > 0 && !g.T.prev) || (dx < 0 && !g.T.next);
    g.x0 = edge ? 0 : Math.max(-g.w, Math.min(g.w, dx));
    place(g.x0, 0);
  });
  app.addEventListener('pointerup', end);
  app.addEventListener('pointercancel', end);
  // once the swipe is ours, stop the browser running its own (invisible) scroll for it;
  // otherwise Chrome treats the next tap as "stop scrolling" and the tap is lost
  app.addEventListener('touchmove', e => { if (g?.on && e.cancelable) e.preventDefault(); }, { passive: false });
  // a drag that ends over a button must not also press it
  document.addEventListener('click', e => { if (performance.now() < noClickUntil) { e.stopPropagation(); e.preventDefault(); LOG.blocked(); } }, true);
})();

/* ---------- pull to refresh ----------
   At the very top of a page, pull down: the page slides down and a red Chinese knot is lowered on its cord into the gap.
   Pull until the knot gives a little bounce, let go, and it swings while the app reloads (same as Chrome's refresh).
   Let go earlier and everything slides back. */
(() => {
  const app = $('#app'), box = $('#ptr');
  // a classic red knot kept simple: a woven diamond with six loops, a gold bead and a tassel
  box.innerHTML = `<div class="ptr-charm"><svg viewBox="-6 0 76 132">
    <defs>
      <linearGradient id="ptrSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3a0606" stop-opacity=".25"/></linearGradient>
      <linearGradient id="ptrGold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F2CF7A"/><stop offset="1" stop-color="#B9852C"/></linearGradient>
    </defs>
    <path d="M32 0V22" stroke="#B5161E" stroke-width="2.2"/>
    <circle cx="32" cy="10" r="4.2" fill="#C8202A" stroke="#7E0D13" stroke-width="1"/>
    <g transform="translate(32 50) rotate(45)">
      <g fill="none" stroke="#C8202A" stroke-width="3.6">
        <circle cx="0" cy="-21.5" r="4.6"/><circle cx="21.5" cy="0" r="4.6"/><circle cx="0" cy="21.5" r="4.6"/><circle cx="-21.5" cy="0" r="4.6"/>
        <circle cx="-21" cy="21" r="5"/><circle cx="21" cy="-21" r="5"/>
      </g>
      <g fill="none" stroke="#7E0D13" stroke-width=".8" opacity=".6">
        <circle cx="0" cy="-21.5" r="6.4"/><circle cx="21.5" cy="0" r="6.4"/><circle cx="0" cy="21.5" r="6.4"/><circle cx="-21.5" cy="0" r="6.4"/>
        <circle cx="-21" cy="21" r="6.8"/><circle cx="21" cy="-21" r="6.8"/>
      </g>
      <rect x="-17.5" y="-17.5" width="35" height="35" rx="3.5" fill="#C8202A"/>
      <path d="M-17 0H17M0 -17V17" stroke="#7E0D13" stroke-width="1.2"/>
      <path d="M-17 -1.5H17M-1.5 -17V17" stroke="#E8505A" stroke-width=".8" opacity=".9"/>
      <rect x="-17.5" y="-17.5" width="35" height="35" rx="3.5" fill="url(#ptrSheen)" stroke="#7E0D13" stroke-width="1"/>
    </g>
    <path d="M32 74V84" stroke="#B5161E" stroke-width="2.2"/>
    <circle cx="32" cy="84" r="4.6" fill="url(#ptrGold)" stroke="#8E6420" stroke-width=".8"/>
    <path d="M27 91C26 104 21 116 19 128Q32 132 45 128C43 116 38 104 37 91Z" fill="#C8202A"/>
    <path d="M30 93C29 106 26 118 25 129M34 93C35 106 38 118 39 129M32 93V130" stroke="#7E0D13" stroke-width=".7" fill="none"/>
    <path d="M27 91C26 104 21 116 19 128Q32 132 45 128C43 116 38 104 37 91Z" fill="url(#ptrSheen)"/>
    <rect x="26" y="89" width="12" height="6" rx="1.6" fill="url(#ptrGold)" stroke="#8E6420" stroke-width=".7"/>
  </svg></div>`;
  const charm = box.firstElementChild, EASE = 'cubic-bezier(.2,.8,.2,1)', reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const ARM = 100, HOLD = 104;   // how far the page has to come down (px) before letting go reloads; where it rests while reloading
  let t = null, busy = false, inset = 0, kh = 90;   // kh: the knot's height, measured once per pull
  const atTop = () => (document.scrollingElement?.scrollTop || 0) <= 0 && app.scrollTop <= 0;
  const blocked = el => $('#sheet-root').classList.contains('open') || el.closest?.('input,textarea,select,.stage,.tzg,canvas,.shelf,#tabbar,#rec,#drawer-root');
  const topInset = () => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top);visibility:hidden'; document.body.append(d); const h = d.offsetHeight; d.remove(); return h; };
  const pull = d => 200 * (1 - Math.exp(-Math.max(0, d) / 240));   // follows the finger at first, then gets heavier
  const place = (p, dur, curve = EASE) => {
    const tr = dur ? `transform ${dur}ms ${curve}, opacity ${dur}ms` : 'none';
    app.style.transition = charm.style.transition = tr;
    app.style.transform = p ? `translate3d(0,${p}px,0)` : '';
    // the knot's bottom hangs just above the page, under the status bar area
    charm.style.transform = `translate3d(0,${inset + p - 6 - kh}px,0)`;
    charm.style.opacity = Math.min(1, p / 36);
  };
  const reset = () => { app.style.transition = app.style.transform = charm.style.transition = charm.style.transform = charm.style.opacity = box.style.rotate = ''; box.classList.remove('armed', 'swing'); };
  const release = ok => {
    const T = t; t = null; if (!T?.on) return;
    if (ok && T.armed) {
      busy = true; LOG.add('pull-refresh', {});
      place(HOLD, 260);
      box.style.transition = 'rotate .3s'; box.style.rotate = '';
      if (!reduce.matches) setTimeout(() => box.classList.add('swing'), 200);
      setTimeout(() => location.reload(), 750);
      return;
    }
    place(0, reduce.matches ? 1 : 320);
    box.style.transition = 'rotate .3s'; box.style.rotate = '';
    setTimeout(() => { if (!t && !busy) reset(); }, 340);
  };
  document.addEventListener('touchstart', e => {
    if (busy || t?.on || e.touches.length !== 1 || blocked(e.target) || !atTop()) { if (!t?.on) t = null; return; }
    const q = e.touches[0]; t = { x: q.clientX, y: q.clientY, on: false, armed: false };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!t) return;
    if (e.touches.length !== 1) { release(false); return; }
    const q = e.touches[0], dx = q.clientX - t.x, dy = q.clientY - t.y;
    if (!t.on) {
      if (dy < -6 || (Math.abs(dx) > 10 && Math.abs(dx) > dy)) { t = null; return; }   // scrolling the page, or a sideways page swipe
      if (dy < 10 || !atTop()) return;
      t.on = true; t.y = q.clientY; inset = topInset(); kh = charm.offsetHeight || kh; box.style.transition = 'none';
    }
    if (e.cancelable) e.preventDefault();
    const p = pull(q.clientY - t.y);
    place(p, 0);
    box.style.rotate = reduce.matches ? '' : Math.max(-7, Math.min(7, (q.clientX - t.x) * 0.05)) + 'deg';   // it sways with your finger
    const armed = p >= ARM;
    if (armed !== t.armed) { t.armed = armed; box.classList.toggle('armed', armed); if (armed) navigator.vibrate?.(8); }
  }, { passive: false });
  document.addEventListener('touchend', () => release(true));
  document.addEventListener('touchcancel', () => release(false));
})();

/* pictures can't be saved, copied or dragged out; no long-press menus outside typing fields; no zoom gestures (iOS ignores the viewport setting) */
document.addEventListener('contextmenu', e => { if (!e.target.closest?.('input,textarea,[contenteditable]')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.closest?.('img,svg')) e.preventDefault(); });
for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });

/* Profile: your name, shown in the menu and as your picture's letter (stored on this phone) */
document.addEventListener('input', e => { if (e.target.id === 'pName') { db.prefs.name = e.target.value.trim().replace(/\s+/g, ' '); save(); } });
document.addEventListener('change', e => { if (e.target.id === 'pName' && db.prefs.name) toast(`Hello, ${db.prefs.name}`); });
document.addEventListener('keydown', e => { if (e.target.id === 'pName' && e.key === 'Enter') e.target.blur(); });

/* keep sheets above the on-screen keyboard */
if (window.visualViewport) {
  const vv = visualViewport;
  const upd = () => document.documentElement.style.setProperty('--kb', Math.max(0, innerHeight - vv.height - vv.offsetTop) + 'px');
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
}
/* re-layout tianzige on rotation */
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'write' && !S.write?.done && !S.write?.revealed && !S.write?.history?.length) render(); }, 200); });

history.replaceState({ d: 0 }, '', location.hash || '#/');
LOG.add('open', deviceInfo()); paintRec();
takePairLink();
route();
if (FRESH) obStart();
if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
