.c1-note{margin:-2px 2px 12px;font-size:14px}
.c1-snd{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--seal-soft);color:var(--seal)}
.c1-snd svg.i{width:18px;height:18px}
/* the four foundation tiles: chunky like the course cards on Learn */
.c1-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c1-tile{display:flex;flex-direction:column;padding:0;border-radius:18px;background:var(--card);overflow:hidden;text-align:left;
  box-shadow:0 0 0 2px rgba(120,95,60,.13),0 3px 0 rgba(120,95,60,.13);transition:transform .2s}
.c1-tile:active{transform:translateY(2px) scale(.98);transition:none}
.c1-art{display:block;background:var(--c1-soft);padding:12px 14px 8px}
.c1-art svg{display:block;width:100%;height:auto;overflow:visible}
.c1-cap{display:flex;flex-direction:column;gap:3px;padding:10px 12px 13px 13px}
.c1-name{font-weight:800;font-size:16.5px;letter-spacing:-.01em;line-height:1.15}
.c1-name .c1-zh{font-size:12.5px}
.c1-sub{font-size:12.5px;line-height:1.3;color:var(--muted)}
.c1-art-box{fill:var(--card);stroke:rgba(120,95,60,.18);stroke-width:1}
.c1-art-py{font:700 9.5px var(--ui);text-anchor:middle;dominant-baseline:central}
.c1-art-hz{font-family:var(--hanzi);font-weight:700;font-size:40px;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.c1-art-plus{font:700 18px var(--ui);text-anchor:middle;dominant-baseline:central;fill:var(--muted)}
.c1-art-ghost{fill:var(--line-2);font-size:50px}
.c1-art-stroke{fill:none;stroke:var(--seal);stroke-width:6;stroke-linecap:round}
.c1-art-n{font:700 8px var(--ui);fill:#fff;text-anchor:middle;dominant-baseline:central}
/* ---------- HSK 1 lessons: the path, then the lesson screens ---------- */
.les-count{font-size:13px;font-weight:700}
.les-intro{margin:-4px 2px 4px;font-size:14px;line-height:1.4}
.les-unit{margin-top:18px}
.les-band{display:flex;flex-direction:column;gap:1px;padding:13px 18px 14px;border-radius:18px;background:var(--c1);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 68%,#000)}
.les-band small{font-size:13px;font-weight:700;opacity:.88}
.les-band b{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.les-band-zh{font-family:var(--hanzi);font-weight:600;font-size:.78em;margin-left:8px;opacity:.9}
.les-path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 0 8px}
.les-row{position:relative;display:grid;place-items:center;transform:translateX(var(--x))}
.les-node{width:66px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--muted);box-shadow:inset 0 -6px 0 rgba(120,95,60,.14);transition:transform .15s}
.les-node:active{transform:translateY(3px)}
.les-node svg.i{width:25px;height:25px}
.les-node.done{background:var(--c1);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.les-node.done svg.i{stroke-width:3.2}
.les-node.cur{width:78px;height:72px;background:var(--seal);color:var(--seal-ink);box-shadow:inset 0 -7px 0 rgba(0,0,0,.22),0 0 0 7px var(--seal-soft)}
.les-glyph{font-family:var(--hanzi);font-weight:700;font-size:33px;line-height:1;margin-top:-4px}
.les-start{position:absolute;bottom:calc(100% + 12px);padding:6px 13px;border-radius:10px;background:var(--card);box-shadow:var(--ring);font-weight:800;font-size:13.5px;color:var(--seal);white-space:nowrap;animation:lesBob 1.8s ease-in-out infinite}
.les-start::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--card)}
@keyframes lesBob{50%{transform:translateY(-4px)}}
.les-shi{position:absolute;left:calc(100% + 20px);top:50%;width:66px;height:66px;margin-top:-33px}
.les-shi.l{left:auto;right:calc(100% + 20px)}
.les-shi .shi-face{width:100%;height:100%;display:block}
.les-sh-top{text-align:center}
.les-sh-top small{font-size:13px;font-weight:700;color:var(--c1)}
.les-sh-top h3{margin:2px 0 14px}
.les-sh-note{margin:14px 0 16px;font-size:14px}
.les-words{display:flex;flex-wrap:wrap;gap:8px}
.les-chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:76px;padding:8px 12px 9px;border-radius:12px;background:var(--fill)}
.les-chip b{font-family:var(--hanzi);font-weight:600;font-size:22px;line-height:1.15}
.les-chip small{font-size:12.5px;font-weight:700;color:var(--seal)}
.les-chip i{font-style:normal;font-size:12.5px;line-height:1.3;color:var(--ink-2);max-width:150px}
.les-chip.have{opacity:.55}
.w-src{margin-top:6px;font-size:13px}
/* inside a lesson */
.les-top{display:flex;align-items:center;gap:12px;height:60px}
.les-bar{flex:1;height:12px;border-radius:7px;background:var(--fill);overflow:hidden}
.les-bar i{display:block;height:100%;border-radius:7px;background:var(--c1);transition:width .35s}
.les-body{display:flex;flex-direction:column;padding:6px 0 20px}
.les-ask{margin:6px 0 16px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.les-ask span{margin-left:8px;font-size:14px;font-weight:700;color:var(--muted)}
.les-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px 28px;border-radius:22px;background:var(--card);box-shadow:0 0 0 2px rgba(120,95,60,.12),0 4px 0 rgba(120,95,60,.12)}
.les-hz{font-family:var(--hanzi);font-weight:600;line-height:1.08;color:var(--ink)}
.les-py{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:12px;background:var(--seal-soft);color:var(--seal);font-size:22px;font-weight:700}
.les-py svg.i{width:20px;height:20px}
.les-mean{font-size:20px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.3}
.les-big{display:flex;align-items:center;justify-content:center;gap:14px;min-height:136px;margin-bottom:18px}
.les-en{font-size:28px;font-weight:800;letter-spacing:-.01em;text-align:center;line-height:1.2}
.les-snd{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--seal-soft);color:var(--seal)}
.les-play{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--seal);color:var(--seal-ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.les-play:active{transform:translateY(2px)}
.les-play svg.i{width:42px;height:42px}
.les-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.les-opts.list{grid-template-columns:1fr}
.les-opt,.les-pair{min-height:84px;padding:12px;border-radius:16px;display:grid;place-items:center;text-align:center;background:var(--card);
  box-shadow:0 0 0 2px rgba(120,95,60,.14),0 4px 0 rgba(120,95,60,.14);transition:background .15s,box-shadow .15s,opacity .25s}
.les-opts.list .les-opt{min-height:58px;padding:12px 18px;justify-items:start;text-align:left}
.les-opt:not(:disabled):active,.les-pair:not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 2px rgba(120,95,60,.14)}
.les-opt{position:relative;transition:background .15s,box-shadow .15s,opacity .3s,transform .3s}
/* answered: the right card keeps its place and gets a red seal stamped on its corner; the others step back.
   A wrong pick is struck through with a brush line, and the right one glows green so you see it */
.les-opts.answered .les-opt:not(.ok):not(.no){opacity:.32;transform:scale(.96)}
.les-opt.ok{background:var(--card);box-shadow:0 0 0 2.5px var(--jade),0 4px 0 var(--jade);opacity:1}
.les-opt.ok.reveal{animation:lesGlow 1.1s ease-in-out 2}
@keyframes lesGlow{50%{box-shadow:0 0 0 2.5px var(--jade),0 4px 0 var(--jade),0 0 0 9px color-mix(in srgb,var(--jade) 22%,transparent)}}
.les-opt.no{background:color-mix(in srgb,var(--ink) 6%,var(--card));box-shadow:0 0 0 2px rgba(120,95,60,.16);opacity:1;animation:lesShake .3s}
.les-opt.no > span{opacity:.45}
.les-opt.no::after{content:"";position:absolute;left:14%;right:14%;top:50%;height:5px;margin-top:-2px;border-radius:3px;background:var(--ink);opacity:.6;
  transform:rotate(-5deg);transform-origin:left center;animation:lesStrike .28s .12s cubic-bezier(.4,0,.2,1) both}
@keyframes lesStrike{from{transform:rotate(-5deg) scaleX(0)}to{transform:rotate(-5deg) scaleX(1)}}
.lo-stamp,.lfb-seal,.lw-stamp{display:grid;place-items:center;border-radius:8px;background:var(--seal);color:#fff;font-family:var(--hanzi);font-weight:700;line-height:1;
  box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 4px rgba(255,255,255,.75),0 3px 8px -2px rgba(126,29,25,.45);transform:rotate(-8deg)}
.lo-stamp{position:absolute;top:-11px;right:-9px;z-index:2;width:36px;height:36px;font-size:21px;animation:lesStamp .42s cubic-bezier(.3,.7,.3,1) both}
@keyframes lesStamp{0%{transform:scale(2.3) rotate(-26deg);opacity:0}55%{transform:scale(.88) rotate(-6deg);opacity:1}78%{transform:scale(1.07) rotate(-9deg)}100%{transform:rotate(-8deg)}}
/* points in the top bar */
.les-pts{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 4px;border-radius:9px;background:var(--card);box-shadow:var(--ring);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.les-pts i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--seal);color:var(--seal-ink);font:700 14px/1 var(--hanzi);font-style:normal}
.les-pts.bump{animation:lesBump .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes lesBump{35%{transform:scale(1.2)}}
.lo-hz{font-family:var(--hanzi);font-weight:600;line-height:1.1;color:var(--ink)}
.lo-py{font-size:22px;font-weight:700;color:var(--ink)}
.lo-en{font-size:16.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.les-pairs{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}
.les-col{display:flex;flex-direction:column;gap:12px}
.les-pair{min-height:66px}
.les-pair.p-sel{background:color-mix(in srgb,var(--c1) 13%,var(--card));box-shadow:0 0 0 2.5px var(--c1),0 4px 0 var(--c1)}
.les-pair.p-bad{background:var(--seal-soft);box-shadow:0 0 0 2.5px var(--seal),0 4px 0 var(--seal);animation:lesShake .3s}
.les-pair.p-gone{opacity:.3;background:var(--jade-soft);box-shadow:none}
@keyframes lesShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.les-dock{position:sticky;bottom:0;z-index:4;margin:auto -20px 0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:var(--paper)}
/* the answer strip: a paper card rising from the bottom, not a coloured panel */
.lfb-dock{animation:lesUp .3s cubic-bezier(.2,.8,.3,1) both}
.lfb-dock.ok{cursor:pointer}
@keyframes lesUp{from{transform:translateY(26px);opacity:0}}
.lfb{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 2px rgba(120,95,60,.12),0 4px 0 rgba(120,95,60,.12)}
.lfb-dock.no .lfb{margin-bottom:12px}
.lfb-seal{flex:none;width:52px;height:52px;font-size:30px;animation:lesStamp .45s .08s cubic-bezier(.3,.7,.3,1) both}
.lfb-shi{flex:none;width:54px;height:54px}
.lfb-shi .shi-face{width:100%;height:100%;display:block}
.lfb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lfb-txt b{font-size:18px;font-weight:800;color:var(--ink)}
.lfb-txt > span{font-size:15px;color:var(--ink-2)}
.lfb-txt small{font-size:13px;color:var(--muted)}
.lfb-hz{font-family:var(--hanzi);font-weight:600;font-size:19px;color:var(--ink)}
.lfb-gain{flex:none;font-size:23px;font-weight:800;color:var(--seal);font-variant-numeric:tabular-nums;animation:lesGain .5s .18s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes lesGain{from{transform:translateY(12px) scale(.7);opacity:0}}
.lfb-time{display:block;height:4px;margin:12px 8px 0;border-radius:2px;background:var(--fill);overflow:hidden}
.lfb-time i{display:block;height:100%;background:var(--c1);transform-origin:left;animation:lesDrain var(--t) linear both}
@keyframes lesDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* writing in the tianzige */
.lw-word{display:flex;flex-direction:column;align-items:center;gap:7px;margin:-6px 0 14px}
.lw-hz{display:flex;align-items:center;gap:3px;font-family:var(--hanzi);font-weight:600;font-size:34px;line-height:1.15;color:var(--ink)}
.lw-gap{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:7px;background:var(--seal-soft);color:var(--seal);font-weight:600}
.lw-gap.hide{background:transparent;border:2px dashed color-mix(in srgb,var(--seal) 70%,transparent)}
.lw-py{font-size:17px;padding:4px 11px}
.lw-py svg.i{width:17px;height:17px}
.lw-en{font-size:16px;font-weight:600;color:var(--ink-2);text-align:center}
.lw-stage{display:grid;place-items:center}
.lw-box{border-radius:10px;box-shadow:0 0 0 2px rgba(120,95,60,.14),0 6px 0 rgba(120,95,60,.12)}
.lw-box.lw-done{box-shadow:0 0 0 2.5px var(--jade),0 6px 0 color-mix(in srgb,var(--jade) 55%,transparent)}
.lw-stamp{position:absolute;right:-14px;bottom:-14px;z-index:3;width:58px;height:58px;font-size:33px;animation:lesStamp .45s .12s cubic-bezier(.3,.7,.3,1) both}
.lw-cap{margin-top:14px}
.lw-hint{display:block;margin:2px auto 0;padding:8px 12px;font-size:14.5px;font-weight:700;color:var(--seal)}
.lw-hint:disabled{opacity:.4}
/* the end: three seals */
.les-seals{display:flex;justify-content:center;gap:14px;margin:22px 0 4px}
.les-seal{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px}
.les-seal i{width:60px;height:60px;border-radius:11px;display:grid;place-items:center;font:700 33px/1 var(--hanzi);font-style:normal;color:var(--line);border:2.5px dashed var(--line)}
.les-seal.got i{border:0;background:var(--seal);color:#fff;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px rgba(255,255,255,.75),0 4px 10px -3px rgba(126,29,25,.5);
  transform:rotate(-8deg);animation:lesStamp .45s var(--d) cubic-bezier(.3,.7,.3,1) both}
.les-seal small{font-size:12.5px;line-height:1.25;color:var(--muted);text-align:center}
.les-seal.got small{color:var(--ink-2);font-weight:600}
.les-tally{display:flex;width:100%;margin-top:18px;border-radius:16px;background:var(--card);box-shadow:var(--ring)}
.les-tally span{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 6px}
.les-tally span+span{border-left:1px solid var(--line)}
.les-tally b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.les-tally small{font-size:12.5px;color:var(--muted)}
.les-wrote{width:100%;margin-top:14px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.les-wrote > small{margin-right:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.btn-jade{background:var(--jade);color:#fff}
.les-end{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:20px}
.les-end-shi{width:150px;height:150px;margin:44px auto 6px;animation:donePop .7s cubic-bezier(.2,.9,.3,1.3) both}
.les-end-shi .shi-face{width:100%;height:100%;display:block}
.les-end h1{margin:8px 0 4px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.les-end > .muted{margin:0;font-size:14.5px}
.les-end-box{width:100%;margin-top:22px;padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--ring);text-align:left}
.les-end-box > b{display:block;margin-bottom:12px;font-size:16.5px;color:var(--jade)}
.les-end-box > small{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.les-start,.les-pair.p-bad,.les-end-shi,.les-opt.no,.les-opt.no::after,.les-opt.ok.reveal,.lo-stamp,.lfb-seal,.lw-stamp,.lfb-dock,.lfb-gain,.lfb-time i,.les-pts.bump,.les-seal.got i{animation:none}}

/* tones: the pitch staff (5 = high, 1 = low) with each tone's line on it */
.tone-svg{display:block;overflow:visible}
.tone-staff{fill:none;stroke:var(--line);stroke-width:1}
.tone-line{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s}
.tone-stage{padding:14px 16px 10px 10px;border-radius:18px;background:var(--card);box-shadow:var(--ring)}
.tone-big{display:block;width:100%;height:auto;overflow:visible}
.tone-big .tone-line{stroke-width:4.5}
.tone-lv{font:700 5.5px var(--ui);fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.tone-line.dim{opacity:.16}
.tone-line.draw{stroke-dasharray:1 1;animation:toneDraw .75s cubic-bezier(.4,.1,.4,1) both}
@keyframes toneDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.tone-hint{margin-top:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.tone-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tone-card{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--ring);text-align:left;transition:box-shadow .2s,transform .2s}
.tone-card:active{transform:scale(.985);transition:none}
.tone-card.on{box-shadow:0 0 0 2.5px var(--tc)}
.tone-mark{flex:none;width:46px;text-align:center;font:800 38px/1 var(--ui);color:var(--tc)}
.tone-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tone-name{font-weight:700;font-size:15px}
.tone-how{font-size:13px;line-height:1.35;color:var(--ink-2)}
.tone-ex{flex:none;display:flex;flex-direction:column;align-items:center;min-width:56px}
.tone-ex b{font-family:var(--hanzi);font-size:26px;font-weight:600;line-height:1.1}
.tone-ex small{font-size:11.5px;color:var(--muted);line-height:1.25}
.tone-ex small:first-of-type{color:var(--tc);font-weight:700;font-size:13px}
.c1-rule-row{align-items:center}
.c1-rule-hz{flex:none;width:52px;font-family:var(--hanzi);font-size:21px;font-weight:600}
.c1-rule-row .row-s{white-space:normal;line-height:1.35}
.c1-rule-row .row-t b{color:var(--seal)}
/* the ear test */
.ear{padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--ring)}
.ear-intro{margin:0 0 14px;font-size:14px;text-align:center}
.ear-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ear-n{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ear-bar{flex:1;height:10px;border-radius:6px;background:var(--fill);overflow:hidden}
.ear-bar i{display:block;height:100%;border-radius:6px;background:var(--c1);transition:width .3s}
.ear-q{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.ear-play{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--seal);color:var(--seal-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.ear-play:active{transform:translateY(2px)}
.ear-play svg.i{width:30px;height:30px}
.ear-reveal{flex:1;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.ear-reveal b{font-family:var(--hanzi);font-size:36px;font-weight:600;line-height:1}
.ear-reveal span{font-size:20px;font-weight:700}
.ear-reveal small{flex-basis:100%;font-size:13px;color:var(--muted)}
.ear-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ear-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px 10px;border-radius:14px;background:var(--fill);font-weight:700;font-size:14px;transition:background .2s,box-shadow .2s}
.ear-opt .tone-svg{width:72%;height:auto}
.ear-opt:not(:disabled):active{transform:scale(.97)}
.ear-opt.ok{background:var(--jade-soft);box-shadow:0 0 0 2.5px var(--jade)}
.ear-opt.no{background:var(--seal-soft);box-shadow:0 0 0 2.5px var(--seal)}
.ear-opt:disabled:not(.ok):not(.no){opacity:.5}
.ear-end{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ear-end b{font-size:20px}
.ear-end .muted{font-size:14px;margin-bottom:6px}
.ear-shi{width:84px;height:84px}
.ear-shi .shi-face{width:100%;height:100%;display:block}

/* pinyin chart: endings down the side, starting sounds across the top (both stay put while you scroll); white boxes on a grid */
.py-search{margin-bottom:12px}
.py-wrap{position:relative;margin:0 -20px;max-height:min(64vh,560px);overflow:auto;overscroll-behavior:contain;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.py-grid{display:grid;grid-template-columns:48px repeat(var(--cols),54px);width:max-content}
.py-c{height:38px;display:grid;place-items:center;font-size:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.py-s{color:var(--ink);transition:background .15s}
.py-s:active,.py-s.on{background:var(--c1);color:#fff;font-weight:700}
.py-h,.py-ini,.py-corner{position:sticky;z-index:1;font-weight:700;font-size:13.5px;background:var(--c1);color:#fff;border-color:color-mix(in srgb,#fff 25%,var(--c1))}
.py-h{top:0}
.py-ini,.py-corner{left:0}
.py-corner{top:0;z-index:2}
.py-credit{margin:8px 2px 0;font-size:12px;color:var(--muted)}
.py-pop{position:absolute;z-index:3;width:272px;padding:10px 10px 12px 14px;border-radius:14px;background:var(--card);
  box-shadow:0 0 0 1px rgba(120,95,60,.14),0 12px 28px -10px rgba(70,45,20,.35)}
.py-pop[hidden]{display:none}
.pyp-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pyp-top b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.pyp-top span{flex:1;font-size:13px;color:var(--muted)}
.pyp-x{align-self:center;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--fill)}
.pyp-x svg.i{width:15px;height:15px}
.pyp-tones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pyp-t{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:11px;background:var(--fill);font-weight:800;font-size:17px;color:var(--tc)}
.pyp-t svg.i{width:15px;height:15px}
.pyp-t:active{background:var(--tc);color:#fff}
.pyp-note{margin:10px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink-2)}

/* radicals: a dictionary page, grouped by stroke count like a paper radical index */
.rad-sec{margin-bottom:18px}
.rad-sec[hidden],.rad[hidden]{display:none}
.rad-h{margin:0 2px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.rad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.rad{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;border-radius:14px;background:var(--card);box-shadow:var(--ring)}
.rad:active{background:var(--c1-soft)}
.rad-g{font-family:var(--hanzi);font-size:30px;font-weight:600;line-height:1.15;color:var(--ink)}
.rad-g small{font-size:15px;color:var(--muted);margin-left:3px}
.rad-en{font-size:12px;color:var(--ink-2);line-height:1.2;text-align:center}
.rs-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.rs-g{font-family:var(--hanzi);font-size:58px;font-weight:600;line-height:1;color:var(--c1)}
.rs-v{font-family:var(--hanzi);font-size:30px;font-weight:600;color:var(--muted)}
.rs-txt{flex:1;display:flex;flex-direction:column;gap:3px}
.rs-txt b{font-size:20px}
.rs-txt span{font-size:13.5px;color:var(--muted)}
.rs-say{background:var(--seal-soft);color:var(--seal)}
.rs-h{margin:0 2px 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.rs-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rs-ch{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px;border-radius:14px;background:var(--card);box-shadow:var(--ring)}
.rs-ch b{font-family:var(--hanzi);font-size:30px;font-weight:600;line-height:1.15}
.rs-ch span{font-size:13px;font-weight:600;color:var(--seal)}
.rs-ch small{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-foot{margin:14px 2px 0;font-size:13px;text-align:center}

/* stroke order */
.sk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;border-radius:14px;background:var(--card);box-shadow:var(--ring)}
.sk svg{width:56px;height:56px;margin-bottom:2px}
.sk-guide{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.sk-line{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.sk.draw .sk-line{stroke:var(--seal);stroke-dasharray:1 1;animation:toneDraw .6s cubic-bezier(.4,.1,.4,1) both}
.sk-zh{font-family:var(--hanzi);font-weight:600;font-size:17px}
.sk-zh small{font-family:var(--ui);font-size:11.5px;color:var(--seal);font-weight:600}
.sk-en{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2}
.sr-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px 11px;border-radius:14px;background:var(--card);box-shadow:var(--ring);text-align:center}
.sr-box{flex:none;box-shadow:none;background:var(--card-2)}
.sr-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sr-txt b{font-size:13.5px;line-height:1.25}
.sr-txt span{font-size:12px;color:var(--muted)}
.hz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.hz-grid .hz{height:52px;border-radius:12px;background:var(--card);box-shadow:var(--ring);font-family:var(--hanzi);font-size:25px;font-weight:600;color:var(--ink)}
.hz-grid .hz:active{background:var(--c1-soft)}
.ss-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ss-hz{font-family:var(--hanzi);font-size:44px;font-weight:600;line-height:1}
.ss-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ss-txt b{font-size:19px}
.ss-txt small{font-size:13.5px;color:var(--muted)}
.ss-btns{margin-top:14px}
@media (prefers-reduced-motion: reduce){.tone-line.draw,.sk.draw .sk-line{animation:none}}

/* ---------- learn + profile ---------- */
.learn-list{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.learn-deck{background:var(--card);border-radius:14px;box-shadow:var(--ring);padding:14px}
.learn-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
.learn-head .deck-name{flex:1}
.learn-head::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none;align-self:center}
/* Learn: lessons will come later; for now a quiet card says so */
.lesson-soon{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;box-shadow:var(--ring);padding:14px}
.lesson-seal{width:40px;height:40px;font-size:22px;border-radius:9px;flex:none}
.lesson-soon b{display:block;font-size:16px;font-weight:600}
.lesson-soon small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.learn-none{margin:0 2px 22px;font-size:14.5px;color:var(--muted)}
/* Learn: a Shi Shi picture fills the word bank tile (tap it to practise) and sits on top of My decks */
.scene-tile{display:block;width:100%;padding:0;background:var(--card);border-radius:14px;box-shadow:var(--ring);overflow:hidden;text-align:left;transition:background .25s}
.scene-tile svg{display:block;width:100%;height:auto}
button.scene-tile:active{background:var(--paper-deep);transition:none}
button.scene-tile:active svg{opacity:.92}
.scene-tile .lesson-soon{box-shadow:none;border-radius:0}   /* the lessons bubble sits inside the picture tile */
/* the pop-up list of your decks, opened from the My decks picture: one bubble per deck */
.dk-list{display:flex;flex-direction:column;gap:10px}
.dk-bub{background:var(--card);border-radius:18px;box-shadow:var(--ring);padding:12px 12px 12px 14px}
.dk-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.dk-top .deck-stack{width:38px;height:45px}
.dk-top .deck-face{font-size:19px}
.dk-meta{flex:1;min-width:0}
.dk-bub .row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dk-bub .btn{height:42px;font-size:15px;padding:0 10px;border-radius:11px}
.dk-bub .btn svg.i{width:18px;height:18px}
.dk-bub .btn.wide{grid-column:1 / -1}
.scene-cap{display:flex;align-items:center;gap:10px;padding:12px 14px 13px 16px}
.scene-cap::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none}
.scene-cap .deck-name{flex:0 1 auto;min-width:0}
.scene-cap .deck-count{flex:1 0 auto;margin:0;white-space:nowrap}
.scene-go{display:flex;align-items:center;gap:2px;font-size:14.5px;font-weight:600;color:var(--seal)}
.scene-go svg.i{width:18px;height:18px}
.learn-deck .btn{height:44px;font-size:15px;padding:0 12px;border-radius:11px}
.learn-deck .btn svg.i{width:19px;height:19px}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-bottom:28px;background:var(--card);border-radius:14px;box-shadow:var(--ring);overflow:hidden}
.stat{position:relative;padding:16px 16px 14px}
.stat:nth-child(odd)::after{content:"";position:absolute;top:14px;bottom:14px;right:0;width:1px;transform:scaleX(.5);background:var(--line-2)}
.stat:nth-child(n+3)::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;transform:scaleY(.5);background:var(--line-2)}
.stat b{display:block;font-family:var(--display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:lining-nums}
.stat span{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.menu-card,.list-group{background:var(--card);border-radius:14px;box-shadow:var(--ring);overflow:hidden}
.list-group{margin-bottom:12px}

/* ---------- activity log ---------- */
/* a small seal-red tab on the left edge while recording; tap it to jot a note */
#rec{position:fixed;left:0;top:42%;z-index:30;width:15px;height:42px;border-radius:0 12px 12px 0;background:var(--seal);
  display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(120,30,20,.5)}
#rec[hidden]{display:none}
#rec::before{content:"";position:absolute;inset:-10px -9px -10px 0}  /* bigger tap area */
#rec i{width:6px;height:6px;border-radius:50%;background:var(--seal-ink);animation:recPulse 1.6s ease-in-out infinite}
@keyframes recPulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ #rec i{animation:none} }
.list-btn .side.with-dot{display:flex;align-items:center}
.dev-now{margin:14px 2px 0;font-size:13.5px;line-height:1.4}
.list-btn .rec-dot{width:9px;height:9px;border-radius:50%;background:var(--seal);margin-right:8px}
.log-count{font-variant-numeric:tabular-nums}
.pair-qr{display:grid;place-items:center;margin:0 auto;width:min(260px,70vw);aspect-ratio:1;background:#fff;border-radius:16px;padding:8px}.pair-qr svg{width:100%;height:100%}
.note-input{width:100%;min-height:96px;border-radius:12px;border:0;box-shadow:var(--ring);background:var(--card);padding:12px 16px;font:inherit;font-size:16px;color:inherit;resize:vertical;outline:none}
.note-input:focus{box-shadow:0 0 0 2px var(--seal)}

/* ---------- full-screen moments: onboarding, streak saved, milestones, welcome back, paywall ---------- */
#ob{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  padding:env(safe-area-inset-top) 0 0;animation:obIn .32s cubic-bezier(.2,.8,.3,1) both}
#ob.out{animation:obOut .2s ease both}
@keyframes obIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes obOut{to{opacity:0;transform:translateY(10px)}}
.ob-in{flex:1;display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto;padding:0 20px}
.ob-top{display:flex;align-items:center;gap:10px;height:60px;flex:none}
.ob-top .icon-btn{color:var(--ink-2);flex:none}
.ob-top .icon-btn[hidden]{display:grid;visibility:hidden}
.ob-prog{flex:1;height:12px;border-radius:8px;background:var(--fill);overflow:hidden}
.ob-prog i{display:block;height:100%;border-radius:8px;background:var(--seal);transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.ob-say{display:flex;align-items:flex-end;gap:12px;margin:12px 0 22px}
.ob-shi{flex:none;width:74px;height:74px}
.ob-shi .shi-face{width:100%;height:100%;display:block}
.ob-bub{position:relative;flex:1;margin:0 0 14px;padding:13px 16px;border-radius:18px 18px 18px 4px;background:var(--card);box-shadow:var(--ring),var(--shadow-sm);
  font-weight:700;font-size:19px;line-height:1.3;letter-spacing:-.01em}
.ob-bub small{display:block;margin-top:4px;font-weight:500;font-size:14.5px;color:var(--ink-2);letter-spacing:0}
.ob-opts{display:flex;flex-direction:column;gap:10px}
.ob-opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border-radius:16px;background:var(--card);text-align:left;
  box-shadow:0 0 0 2px rgba(120,95,60,.12),0 3px 0 rgba(120,95,60,.12);transition:box-shadow .15s,background .15s,transform .15s}
.ob-opt:active{transform:translateY(2px);box-shadow:0 0 0 2px rgba(120,95,60,.12),0 1px 0 rgba(120,95,60,.12);transition:none}
.ob-opt[aria-pressed="true"]{background:color-mix(in srgb,var(--card) 88%,var(--seal));box-shadow:0 0 0 2.5px var(--seal),0 3px 0 var(--seal)}
.ob-glyph{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--seal-soft);color:var(--seal);font-family:var(--hanzi);font-weight:600;font-size:23px}
.ob-opt[aria-pressed="true"] .ob-glyph{background:var(--seal);color:var(--seal-ink)}
.ob-opt b{display:block;font-size:16.5px;line-height:1.25}
.ob-opt small{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.ob-opt .ob-txt{flex:1;min-width:0}
.ob-opt .ob-num{flex:none;font-family:var(--display);font-weight:600;font-size:30px;line-height:1;color:var(--ink-2);font-variant-numeric:lining-nums tabular-nums}
.ob-dock{position:sticky;bottom:0;margin-top:auto;padding:16px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 26%);display:flex;flex-direction:column;gap:6px}
.ob-dock .btn{width:100%;height:54px;font-size:17px}
.ob-dock .btn:disabled{opacity:1;background:var(--fill);color:var(--muted)}
.ob-link{height:44px;font-weight:600;font-size:15px;color:var(--ink-2)}
/* welcome */
.ob-hi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:20px}
.ob-hi .ob-big{width:min(220px,56vw);aspect-ratio:1;animation:donePop .7s cubic-bezier(.2,.9,.3,1.3) both}
.ob-hi .ob-big .shi-face{width:100%;height:100%;display:block;animation:shiHop 1.4s ease-in-out .9s 2}
.ob-name{margin:18px 0 0;font-family:'Baloo 2',var(--ui);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.01em;color:var(--seal)}
.ob-hi h1{margin:14px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;max-width:15em;text-wrap:balance}
.ob-hi p{margin:8px 0 0;font-size:16px;color:var(--ink-2);max-width:20em}
/* first lesson: a card you turn over */
/* character check */
.ob-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ob-ch-t{position:relative;aspect-ratio:1;border-radius:16px;background:var(--card);font-family:var(--hanzi);font-weight:600;font-size:clamp(30px,9vw,40px);line-height:1;color:var(--ink);
  box-shadow:0 0 0 2px rgba(120,95,60,.12),0 3px 0 rgba(120,95,60,.12);transition:box-shadow .15s,background .15s,transform .15s}
.ob-ch-t:active{transform:translateY(2px);transition:none}
.ob-ch-t i{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--seal);color:#fff;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.ob-ch-t i svg.i{width:14px;height:14px;stroke-width:3}
.ob-ch-t[aria-pressed="true"]{background:color-mix(in srgb,var(--card) 86%,var(--seal));box-shadow:0 0 0 2.5px var(--seal),0 3px 0 var(--seal)}
.ob-ch-t[aria-pressed="true"] i{transform:scale(1)}
.ob-wait{height:200px}
.ob-qask{margin-top:4px}
.ob-qcard{padding:26px 20px 22px;margin-bottom:18px}
.ob-qcard .les-mean{font-size:16px;color:var(--ink-2)}
.ob-story{padding:18px 18px 16px;border-radius:18px;background:var(--card);box-shadow:var(--ring),var(--shadow-sm);font-family:var(--hanzi);font-size:21px;line-height:1.75;color:var(--ink);text-align:justify}
.ob-sq{margin:20px 2px 12px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.ob-sigs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:330px;margin:16px auto 0}
.ob-sig{display:flex;flex-direction:column;align-items:center;padding:7px 12px;border-radius:12px;background:var(--card);box-shadow:var(--ring)}
.ob-sig small{font-size:11.5px;color:var(--muted);font-weight:600}
.ob-sig b{font-size:14px;font-weight:800}
/* your level */
.ob-art-s{width:min(120px,32vw);margin-top:4px}
.ob-place{display:flex;flex-direction:column;align-items:center;margin:14px 0 0}
.ob-place small{font-size:15px;color:var(--ink-2)}
.ob-place b{font-family:var(--display);font-weight:600;font-size:76px;line-height:.95;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.ob-lvls{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0 0}
.ob-lvls span{height:34px;border-radius:9px;display:grid;place-items:center;background:var(--fill);font-size:13px;font-weight:800;color:var(--muted)}
.ob-lvls span.done{background:var(--jade-soft);color:var(--jade)}
.ob-lvls span.now{background:var(--seal);color:var(--seal-ink);box-shadow:0 3px 0 #7E1D19}
/* daily minutes, with how soon each gets you to the next level */
.ob-gopt{gap:12px}
.gopt-min{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;line-height:1}
.gopt-min b{font-family:var(--display);font-weight:600;font-size:30px;font-variant-numeric:lining-nums;color:var(--ink)}
.gopt-min small{font-size:12px;font-weight:700;color:var(--muted);margin-top:1px}
.gopt-bar{display:block;height:8px;margin-top:7px;border-radius:5px;background:var(--fill);overflow:hidden}
.gopt-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#E8A33C,#FFD15C)}
.ob-opt[aria-pressed="true"] .gopt-bar i{background:var(--seal)}
.gopt-when{flex:none;text-align:right;line-height:1.2}
.gopt-when b{display:block;font-size:14px}
.gopt-when small{display:block;font-size:12.5px;color:var(--muted)}
.ob-opt[aria-pressed="true"] .gopt-when small{color:var(--seal);font-weight:700}
.ob-you{display:flex;flex-direction:column;align-items:center;margin:10px 0 0}
.ob-you small{font-size:16px;font-weight:600;color:var(--ink-2)}
.ob-hsk{display:flex;align-items:baseline;gap:12px;font-family:var(--display);font-weight:600;line-height:1;color:var(--ink);margin:2px 0 4px}
.ob-hsk > span:first-child{font-size:44px}
.ob-reel{display:inline-block;height:84px;overflow:hidden;font-size:84px;line-height:84px;color:var(--seal);font-variant-numeric:lining-nums tabular-nums}
.ob-reel-in{display:flex;flex-direction:column;align-items:center;transform:translateY(calc(var(--p) * -84px));transition:transform var(--d,.15s) cubic-bezier(.3,1.4,.5,1)}
.ob-reel-in b{height:84px;font-weight:700}
.ob-hsk.landed .ob-reel{animation:obLand .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes obLand{40%{transform:scale(1.14)}}
.ob-chars{margin-top:2px;font-size:14px!important;font-weight:500!important;color:var(--muted)!important}
.ob-add{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 8px;margin:18px auto 0;font-size:14px;color:var(--ink-2);text-align:center}
.ob-add-n{padding:3px 9px;border-radius:8px;background:var(--jade-soft);color:var(--jade);font-weight:800;font-size:13.5px}
.ob-next{margin:8px auto 0;font-size:14px;color:var(--muted);text-align:center;max-width:22em}
.ob-note{margin:12px 2px 0;font-size:13px;color:var(--muted);text-align:center}
/* celebration (also used by milestones and streak moments) */
.mo-hero{position:relative;text-align:center;padding:20px 0 0}
.mo-hero .done-shi{width:170px;height:170px}
.mo-hero h2{font-family:var(--hanzi);font-weight:600;font-size:34px;margin:12px 0 2px}
.mo-sub{font-size:15px;color:var(--muted)}
.mo-title{text-wrap:balance;margin:18px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-align:center}
.mo-text{margin:0 auto;font-size:16px;line-height:1.45;color:var(--ink-2);text-align:center;max-width:22em}
.mo-big{display:flex;align-items:center;justify-content:center;gap:4px;margin:20px 0 0}
.mo-big b{font-family:var(--display);font-weight:600;font-size:110px;line-height:.8;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.mo-big .flame{width:92px;height:92px}
.mo-big.cold .flame .f-out{fill:#8FD0F7;stroke:#2A6FA8}
.mo-big.cold .flame .f-mid{fill:#C9EBFF}
.mo-big.cold .flame .f-core{fill:#fff}
.mo-week{display:flex;justify-content:center;gap:8px;margin:22px 0 0}
.mo-week span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.mo-week i{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.mo-week i.on{background:#E8742C}
.mo-week i.ice{background:#9FD3F5}
.mo-week i svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mo-card{display:flex;align-items:center;gap:14px;margin:22px 0 0;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:var(--ring)}
.mo-card b{display:block;font-size:15.5px}
.mo-card small{display:block;font-size:13.5px;color:var(--ink-2)}
.mo-card .ice{width:42px;height:42px;flex:none}
.mo-pips{display:flex;gap:6px;margin-top:8px}
.mo-pips i{width:26px;height:8px;border-radius:5px;background:var(--fill)}
.mo-pips i.on{background:#E8742C}
.ob-hours{justify-content:center;margin:6px 0 0}
.ob-art{width:min(190px,50vw);margin:20px auto 0}
.ob-art .shi-face{width:100%;height:auto;display:block}
.ob-phone{position:relative;width:150px;height:150px;margin:24px auto 0;border-radius:34px;background:var(--card);box-shadow:var(--ring),var(--shadow-sm);display:grid;place-items:center}
.ob-phone img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 16px -6px rgba(70,45,20,.4)}
.ob-phone::after{content:"";position:absolute;top:22px;right:24px;width:22px;height:22px;border-radius:50%;background:var(--seal);box-shadow:0 0 0 3px var(--card)}
/* daily goal ring around the flame on Decks */
.hm-streak .gring{position:relative;width:34px;height:34px;display:grid;place-items:center;flex:none}
.hm-streak .gring svg.gr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.gr circle{fill:none;stroke-width:3}
.gr .gr-bg{stroke:var(--fill)}
.gr .gr-fg{stroke:var(--jade);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.hm-streak .gring .flame{width:22px;height:22px}
/* daily goal: Streak page row and end of round */
.goal-row{display:flex;align-items:center;gap:12px;width:100%;margin:16px 0 0;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--ring);text-align:left}
.goal-row .goal-main{flex:1;min-width:0}
.goal-row b{display:block;font-size:15px}
.goal-row small{display:block;font-size:13px;color:var(--muted)}
.goal-bar{display:block;height:10px;margin-top:7px;border-radius:6px;background:var(--fill);overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:6px;background:var(--jade);transition:width .6s ease}
.goal-row .goal-ch{flex:none;font-size:14px;font-weight:700;color:var(--seal)}
.done-goal{margin:12px 0 0}
.done-goal .goal-row{margin:0}
/* badges on Profile */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.bdg{display:flex;flex-direction:column;align-items:center;padding:14px 6px 12px;border-radius:16px;background:var(--card);box-shadow:var(--ring);text-align:center}
.bdg-seal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--hanzi);font-weight:600;font-size:25px;
  background:radial-gradient(circle at 35% 30%,#FFE58A,#F4C14E 60%,#E8A33C);color:#7E1D19;box-shadow:0 0 0 3px #fff,0 0 0 5px #E8A33C,0 4px 8px -2px rgba(168,106,12,.5)}
.bdg b{display:block;margin-top:10px;font-size:13.5px;line-height:1.2}
.bdg small{display:block;margin-top:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bdg.off .bdg-seal{background:var(--fill);color:var(--line-2);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--line)}
.bdg.off b{color:var(--ink-2)}
.bdg-bar{width:70%;height:5px;margin-top:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bdg-bar i{display:block;height:100%;background:#E8A33C}
/* paywall (preview only) */
.pw-top{display:flex;justify-content:space-between;align-items:center;height:56px;flex:none}
.pw-tag{padding:5px 10px;border-radius:8px;background:var(--fill);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pw-head{display:flex;align-items:center;gap:14px}
.pw-head .ob-shi{width:64px;height:64px}
.pw-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pw-head h2 span{color:var(--seal)}
.pw-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.pw-list li{display:flex;align-items:center;gap:12px;font-size:15.5px;font-weight:600}
.pw-list li i{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade);font-style:normal;font-family:var(--hanzi);font-size:16px}
.pw-tl{position:relative;margin:18px 0 6px;padding:4px 0 0 0}
.pw-tl h3{margin:0 0 12px;font-size:16px;font-weight:800}
.pw-step{position:relative;display:flex;gap:14px;padding-bottom:12px}
.pw-step:not(:last-child)::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:3px;border-radius:2px;background:var(--line)}
.pw-step:first-of-type:not(:last-child)::before{background:linear-gradient(var(--seal),var(--line))}
.pw-dot{flex:none;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-2)}
.pw-dot svg.i{width:18px;height:18px}
.pw-step.now .pw-dot{background:var(--seal);color:var(--seal-ink)}
.pw-step b{display:block;font-size:15px}
.pw-step small{display:block;font-size:13.5px;color:var(--ink-2)}
.pw-plans{display:flex;flex-direction:column;gap:10px;margin:6px 0 0}
.pw-plan{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;background:var(--card);text-align:left;box-shadow:0 0 0 2px rgba(120,95,60,.14)}
.pw-plan[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--seal);background:color-mix(in srgb,var(--card) 92%,var(--seal))}
.pw-radio{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2)}
.pw-plan[aria-pressed="true"] .pw-radio{box-shadow:inset 0 0 0 7px var(--seal)}
.pw-plan .pw-pt{flex:1}
.pw-plan b{display:block;font-size:16px}
.pw-plan small{display:block;font-size:13px;color:var(--muted)}
.pw-price{text-align:right;font-weight:800;font-size:16px}
.pw-price small{font-weight:500}
.pw-save{position:absolute;top:-10px;right:14px;padding:3px 9px;border-radius:7px;background:var(--seal);color:var(--seal-ink);font-size:11.5px;font-weight:800;letter-spacing:.02em}

<body>
<!-- colours for the streak flame (see .flame in the styles); kept out of view but not display:none, which would break the gradients -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="flOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2442B"/><stop offset=".55" stop-color="#FF6A1F"/><stop offset="1" stop-color="#FF8A1A"/></linearGradient>
  <linearGradient id="flMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A1F"/><stop offset="1" stop-color="#FFC233"/></linearGradient>
  <linearGradient id="flCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset="1" stop-color="#FFE066"/></linearGradient>
</defs></svg>
<div id="frame">
  <div id="ptr" aria-hidden="true"></div>
  <main id="app"></main>
  <nav id="tabbar" aria-label="Main"></nav>
  <div id="drawer-root"></div>
  <div id="sheet-root"></div>
  <div id="toast"></div>
  <button id="rec" data-act="rec-note" hidden aria-label="Recording your activity. Tap to add a note"><i></i></button>
</div>

<script>
/* =========================================================
   ShiCards — hanzi flashcards
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const HAN = /\p{Script=Han}/u;
const hanChars = s => [...(s || '')].filter(c => HAN.test(c));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ACCENTS = ['#B23A2C', '#3F7A5F', '#3E5C80', '#B5893A', '#7B4B67'];

const ic = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const I = {
  back: ic('<path d="M15 5l-7 7 7 7"/>'),
  close: ic('<path d="M6 6l12 12M18 6L6 18"/>'),
  share: ic('<path d="M12 3.5v11M7.5 8L12 3.5 16.5 8"/><path d="M5.5 12.5v6a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-6"/>'),
  more: ic('<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  menu: ic('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  moon: ic('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  chev: ic('<path d="M9 6l6 6-6 6"/>'),
  left: ic('<path d="M15 6l-6 6 6 6"/>'),
  right: ic('<path d="M9 6l6 6-6 6"/>'),
  shuffle: ic('<path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6c1.1 1.7 2.3 2.7 4.3 2.7H21M3 17h3.5c1.3 0 2.3-.4 3.1-1.2M13.4 8.2c.8-.8 1.8-1.2 3.1-1.2H21M18 4l3 3-3 3M18 14l3 3-3 3"/>'),
  flip: ic('<rect x="4" y="4.5" width="11" height="15" rx="2.2"/><path d="M18 8c1.5 1 2.2 2.4 2.2 4 0 2.6-2.4 4.6-5.7 5.1"/><path d="M16 15.3l-1.6 1.8 1.9 1.5"/>'),
  undo: ic('<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'),
  trash: ic('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  bulb: ic('<path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.5 1.1-2.1A6 6 0 0 0 12 3z"/>'),
  search: ic('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/>'),
  eye: ic('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  swap: ic('<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>'),
  bksp: ic('<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M12 9l6 6M18 9l-6 6"/>'),
  play: ic('<path d="M7 5l12 7-12 7z"/>'),
  pen: ic('<path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/>'),
  decks: ic('<rect x="8" y="3.5" width="11.5" height="14.5" rx="2"/><path d="M4.5 7.5v10a3 3 0 0 0 3 3h8"/>'),
  learn: ic('<path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z"/><path d="M12 6.5v13"/>'),
  profile: ic('<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/>'),
  camera: ic('<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/>'),
  read: ic('<path d="M6.5 3.5h8l4 4v12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M9 11.5h6.5M9 15h6.5M9 18.5h3.5"/>'),
  sound: ic('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
  refresh: ic('<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 4.2v4.3h-4.3"/>'),
  install: ic('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7v7M9.2 11.2L12 14l2.8-2.8"/>'),
  download: ic('<path d="M12 4v10.5M7.5 10L12 14.5 16.5 10"/><path d="M4.5 15.5v3A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-3"/>'),
  upload: ic('<path d="M12 14.5V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 15.5v3A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-3"/>'),
  log: ic('<path d="M9 6.5h10.5M9 12h10.5M9 17.5h7"/><path d="M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5" stroke-width="2.6"/>'),
  code: ic('<path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/>'),
  bell: ic('<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
};
/* filled versions, shown on the active tab */
const icOn = p => `<svg class="i i-on" viewBox="0 0 24 24">${p}</svg>`;
const IF = {
  decks: icOn('<path d="M4.5 7.5v10a3 3 0 0 0 3 3h8"/><rect x="8" y="3.5" width="11.5" height="14.5" rx="2" fill="currentColor"/>'),
  learn: icOn('<path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z" fill="currentColor"/><path d="M12 7.5v11" style="stroke:var(--seal)"/>'),
  read: icOn('<path d="M6.5 3.5h8l4 4v12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" fill="currentColor"/><path d="M9 11.5h6.5M9 15h6.5M9 18.5h3.5" style="stroke:var(--seal)"/>'),
  profile: icOn('<circle cx="12" cy="8.5" r="3.8" fill="currentColor"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5z" fill="currentColor"/>'),
};
const TZG = `<svg class="tzg-bg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <rect x=".8" y=".8" width="98.4" height="98.4" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  <path d="M50 1V99M1 50H99" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke" opacity=".8"/></svg>`;
const miniTZG = ch => `<div class="tzg" style="--s:44px;box-shadow:none;border-radius:4px">${TZG}<div style="position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hanzi);font-size:28px;color:var(--ink)">${ch}</div></div>`;

/* ---------- storage ---------- */
const KEY = 'moka.v1';
function seed() {
  const now = Date.now();
  const mk = rows => rows.map(([en, hanzi, pinyin]) => ({ id: uid(), en, hanzi, pinyin, created: now, hist: [] }));
  return {
    prefs: { englishFirst: true, writeMode: 'free', outline: false },
    decks: [{ id: uid(), name: 'First words', accent: ACCENTS[0], created: now, cards: mk([
      ['hello', '你好', 'nǐ hǎo'], ['thank you', '谢谢', 'xiè xie'], ['friend', '朋友', 'péng you'],
      ['to study', '学习', 'xué xí'], ['cat', '猫', 'māo'], ['tea', '茶', 'chá'],
      ['library', '图书馆', 'tú shū guǎn'], ['have a safe trip', '一路平安', 'yí lù píng ān'],
    ]) }],
  };
}
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.decks)) return d; } catch (e) {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
const FRESH = (() => { try { return !localStorage.getItem(KEY); } catch (e) { return false; } })();   // first time ShiCards opens on this phone: show the onboarding
let db = load();
db.prefs = Object.assign({ englishFirst: true, writeMode: 'free', outline: false }, db.prefs);
db.prefs.writeN ??= 10;   // word bank writing: how many at a time (0 = all)
function applyTheme() {   // Menu › Dark mode: dark palette on <html>, and the phone's status bar colour to match
  document.documentElement.dataset.theme = db.prefs.dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', db.prefs.dark ? '#14120F' : '#F4EEE3');
}
applyTheme();
if (!db.prefs.enDefault) { db.prefs.englishFirst = true; db.prefs.enDefault = 1; }   // v1.86: Flip cards start on English for everyone, once; the switch still works after that
if (db.prefs.goal && !db.prefs.goalMin) { db.prefs.goalMin = { 5: 5, 10: 10, 20: 15, 30: 20 }[db.prefs.goal] || 10; delete db.prefs.goal; }   // v1.82 goals were words a day
db.bank = Array.isArray(db.bank) ? db.bank : [];   // word bank: [{ id, hanzi, pinyin, en, added }], newest first
db.lessons = db.lessons && typeof db.lessons === 'object' ? db.lessons : {};   // HSK 1 lessons you finished: { n: { done, last, best } }
db.readDone = Array.isArray(db.readDone) ? db.readDone : [];   // finished stories: [{ id, zh, en, lines, hsk, done, learned }], newest first
db.days = db.days && typeof db.days === 'object' ? db.days : {};   // per day ("2026-10-17", month from 0): { decks: { deckId: { name, n, cards } } }: the different cards you practised
// streak freezes: have = how many are saved up (at most 2), days = the days a freeze covered, run/given = the 7-day rewards of the current streak
db.freeze = Object.assign({ have: 1, days: [], run: null, given: 0 }, db.freeze);
save();

const deckById = id => id === 'bank' ? bankDeck() : id === 'today' ? (S.today || todayDeck()) : db.decks.find(d => d.id === id);
const curDeck = () => deckById(S.deckId);
const cardById = (d, id) => d.cards.find(c => c.id === id);

/* ---------- routing ---------- */
const S = { view: 'home', deckId: null, study: null, write: null, smo: 0 };   // smo: which month the Streak calendar shows (0 = this month)
function parse() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'deck' && p[1] === 'bank') return p[2] === 'study' || p[2] === 'write' ? { view: p[2], deckId: 'bank' } : { view: 'bank', deckId: null };
  if (p[0] === 'deck' && p[1] === 'today') return p[2] === 'study' ? { view: 'study', deckId: 'today' } : { view: 'learn', deckId: null };
  if (p[0] === 'deck' && deckById(p[1])) return { view: p[2] || 'deck', deckId: p[1] };
  if (p[0] === 'hsk') return { view: 'hsk', deckId: null, lv: Math.min(7, Math.max(0, +p[1] || 0)) || null };
  if (p[0] === 'basics') return { view: 'course', deckId: null, basics: true, part: p[1] || null };
  if (p[0] === 'course' && p[1] === '1' && p[2] === 'lesson') return { view: 'lesson', deckId: null, les: +p[3] || 0 };
  if (p[0] === 'course' && p[1] === '1') return { view: 'course', deckId: null, part: p[2] || null };   // only HSK 1 has a course so far; its old /tones etc. links still open the Basics pages
  if (p[0] === 'read') return { view: 'read', deckId: null, readId: p[1] || null };
  if (p[0] === 'learn' || p[0] === 'profile' || p[0] === 'bank' || p[0] === 'streak') return { view: p[0], deckId: null };
  return { view: 'home', deckId: null };
}
function route() {
  closeSheet(true); $('#cheer')?.remove(); closeDrawer();
  const r = parse(); S.view = r.view; S.deckId = r.deckId;
  if ((r.lv || null) !== S.hskLevel || !S.hskSel) S.hskSel = new Set();   // words ticked on an HSK level page, kept while you stay on it
  S.hskLevel = r.lv || null; S.readId = r.readId || null; S.cPart = r.part || null; S.cBasics = !!r.basics;
  const d = curDeck();
  if ((S.view === 'study' || S.view === 'write') && (!d || !d.cards.length)) {
    if (S.deckId === 'today') { history.replaceState(history.state, '', '#/learn'); S.view = 'learn'; S.deckId = null; }
    else S.view = S.deckId === 'bank' ? 'bank' : 'deck';
  }
  if (S.view === 'study') startStudy();
  if (S.view === 'write') startWrite();
  if (S.view === 'lesson') lesRoute(r.les);
  // what you used last, for the slot under the word bank on the Decks page
  if (d && S.deckId !== 'bank' && S.deckId !== 'today' && ['deck', 'study', 'write'].includes(S.view)) { db.last = { t: 'deck', id: S.deckId }; save(); }
  if (S.view === 'read' && !S.readId && db.readCur?.opened) { db.last = { t: 'read' }; save(); }
  render();
  LOG.add('page', S.deckId ? { deck: d?.name } : undefined);
  if (S.toTop) { S.toTop = false; const top = () => { window.scrollTo(0, 0); $('#app').scrollTop = 0; }; top(); requestAnimationFrame(top); }
}
function nav(h) { const d = (history.state?.d || 0) + 1; history.pushState({ d }, '', h); route(); window.scrollTo(0, 0); $('#app').scrollTop = 0; }
function goBack(fallback) { if ((history.state?.d || 0) > 0) history.back(); else { history.replaceState({ d: 0 }, '', fallback); route(); } }
addEventListener('popstate', route);

/* ---------- activity log ----------
   Off unless switched on in the side menu (tap the menu button on Decks). While on, it notes what you do (pages, taps, swipes, flips,
   writing checks, errors, your own notes) and keeps it on this phone only. Share it with Claude to tune the app. */
const LOG = (() => {
  const KEYL = 'shicards.log', MAX = 5000;
  let st = null, timer = 0;
  try { st = JSON.parse(localStorage.getItem(KEYL)); } catch (_) {}
  if (!st || !Array.isArray(st.ev)) st = { on: false, ev: [] };
  const flush = () => {
    clearTimeout(timer); timer = 0;
    for (let k = 0; k < 4; k++) {   // storage full: drop the oldest third and try again
      try { localStorage.setItem(KEYL, JSON.stringify(st)); return; } catch (_) { st.ev.splice(0, Math.ceil(st.ev.length / 3)); }
    }
  };
  const add = (k, d) => {
    if (!st.on) return;
    const e = { t: Date.now(), k, at: S.view };
    if (d !== undefined) e.d = d;
    st.ev.push(e);
    if (st.ev.length > MAX) st.ev.splice(0, st.ev.length - MAX);
    if (!timer) timer = setTimeout(flush, 500);
  };
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { add('app', document.visibilityState === 'hidden' ? 'left the app' : 'came back'); if (document.hidden) flush(); });
  addEventListener('error', e => add('error', `${e.message} (line ${e.lineno})`));
  addEventListener('unhandledrejection', e => add('error', String(e.reason?.message || e.reason)));
  return {
    add, flush,
    get on() { return st.on; },
    get ev() { return st.ev; },
    set(on) {
      if (on === st.on) return;
      if (!on) add('log', 'stopped');
      st.on = on;
      if (on) { add('log', 'started'); add('device', deviceInfo()); }
      flush(); paintRec();
    },
    clear() { st.ev = []; if (st.on) add('log', 'cleared'); flush(); },
    blocked() {   // the app swallowed the last tap (it ended a swipe): mark it, or drop it if it hit nothing anyway
      const e = st.ev[st.ev.length - 1];
      if (e?.k === 'tap') e.k = 'tap-blocked'; else if (e?.k === 'tap-nothing') st.ev.pop();
    },
  };
})();
function deviceInfo() {
  const ua = navigator.userAgent;
  const os = (ua.match(/Android [\d.]+|iPhone OS [\d_]+|iPad; CPU OS [\d_]+|Windows NT [\d.]+|Mac OS X [\d_.]+/) || ['?'])[0].replace(/_/g, '.');
  const br = (ua.match(/SamsungBrowser\/\d+|EdgA?\/\d+|Firefox\/\d+|CriOS\/\d+|Chrome\/\d+|Version\/[\d.]+ (?:Mobile\/\S+ )?Safari/) || ['?'])[0];
  return { app: APP_VERSION, os, browser: br, screen: `${innerWidth}x${innerHeight}`, dpr: devicePixelRatio, installed: isInstalled() };
}
/* what a tapped thing was, in words: its action, id and visible label */
function tapLabel(el) {
  const txt = (el.getAttribute('aria-label') || (el.isConnected ? el.innerText : el.textContent) || el.value || '').trim().replace(/\s*\n\s*/g, ' · ').replace(/\s+/g, ' ').slice(0, 60);
  return [el.dataset?.act && `[${el.dataset.act}]`, el.id && `#${el.id}`, txt && `"${txt}"`].filter(Boolean).join(' ') || el.tagName.toLowerCase();
}
// capture phase: the tap is written down before whatever it causes (a new page, a toast)
addEventListener('click', e => {
  if (!LOG.on || !(e.target instanceof Element)) return;
  const el = e.target.closest('button,a,label,input,select,textarea,[data-act]');
  if (el) { if (!(el.matches('input[type=file]') && e.target.closest('label'))) LOG.add('tap', tapLabel(el)); return; }
  if (e.target.closest('canvas,.tzg,.stage')) return;   // drawing and the flip card log themselves
  // a tap on something that does nothing: often a sign it looked tappable
  const spot = e.target.closest('[class]'), words = (e.target.textContent || '').replace(/\s+/g, ' ').trim();
  LOG.add('tap-nothing', { on: spot ? '.' + spot.classList[0] : e.target.tagName.toLowerCase(), text: words.length <= 40 ? words : undefined, x: Math.round(e.clientX), y: Math.round(e.clientY) });
}, true);
function paintRec() { const r = $('#rec'); if (r) r.hidden = !LOG.on; }
const p2 = n => String(n).padStart(2, '0');
const clock = t => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
function logSummary() {
  const ev = LOG.ev; if (!ev.length) return LOG.on ? 'Recording · nothing yet' : 'Off · nothing recorded';
  const first = new Date(ev[0].t), today = first.toDateString() === new Date().toDateString();
  return `${LOG.on ? 'Recording' : 'Off'} · ${plural(ev.length, 'event')} since ${clock(ev[0].t)}${today ? ' today' : ', ' + first.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`;
}
/* plain text, one line per event, readable by people and by Claude */
function logText() {
  const ev = LOG.ev, fmt = d => d == null ? '' : typeof d !== 'object' ? String(d)
    : Object.entries(d).filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
  const hms = t => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${Math.floor(d.getMilliseconds() / 100)}`; };
  let day = '';
  const lines = ev.map(e => {
    const ds = new Date(e.t).toDateString(), head = ds === day ? '' : `\n== ${new Date(e.t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })} ==\n`;
    day = ds;
    return `${head}${hms(e.t)}  ${e.k.padEnd(13)} ${(e.at || '').padEnd(8)} ${fmt(e.d)}`;
  });
  return `ShiCards activity log · app ${APP_VERSION} · ${plural(ev.length, 'event')}\n`
    + `Columns: time · what happened · page · details. "tap-nothing" = a tap on something that does nothing.\n` + lines.join('\n') + '\n';
}

/* Send to Claude automatically: with a GitHub key saved on this phone, the log is uploaded as plain text to a

   never goes into the log. Uploads happen when the log has changed: on leaving the app and every few minutes. */
const SYNC = (() => {
  const KEYS = 'shicards.sync', REPO = 'ilkegits/shicards-log', EVERY = 3 * 60e3, API = `https://api.github.com/repos/${REPO}/contents/`;
  let st = {}, busy = false;
  try { st = JSON.parse(localStorage.getItem(KEYS)) || {}; } catch (_) {}
  if (!st.id) st.id = Math.random().toString(36).slice(2, 8);
  const keep = () => { try { localStorage.setItem(KEYS, JSON.stringify(st)); } catch (_) {} };
  const path = () => `logs/${st.id}.txt`;
  const head = () => ({ Authorization: `Bearer ${st.key}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
  const b64 = text => { const b = new TextEncoder().encode(text); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(bin); };

  async function send(force) {
    const last = LOG.ev[LOG.ev.length - 1]?.t || 0;
    if (!st.key || busy || !navigator.onLine || (!force && (last === st.sentT || Date.now() - (st.sentAt || 0) < EVERY && document.visibilityState === 'visible'))) return st.err ? false : null;
    busy = true;
    try {
      const body = t => JSON.stringify({ message: `log from ${deviceInfo().os} · ${LOG.ev.length} events`, content: b64(logText()), sha: t });
      if (st.sha === undefined) st.sha = await sha();
      let r = await fetch(API + path(), { method: 'PUT', headers: head(), body: body(st.sha) });
      if (r.status === 409 || r.status === 422) { st.sha = await sha(); r = await fetch(API + path(), { method: 'PUT', headers: head(), body: body(st.sha) }); }
      if (!r.ok) throw r;

      return true;
    } catch (e) {
      st.err = e?.status === 401 || e?.status === 403 || e?.status === 404 ? 'GitHub didn’t accept the key' : 'Couldn’t reach GitHub, will try again';
      if (e?.status === 404) st.sha = undefined;
      return false;
    } finally { busy = false; keep(); paintSync(); }
  }
  document.addEventListener('visibilitychange', () => send());
  setInterval(() => { if (document.visibilityState === 'visible') send(); }, EVERY);

  async function put(p, text, msg) {

      if (!(p in shas)) shas[p] = await now();
      let r = await fetch(url, { method: 'PUT', headers: head(), body: body(shas[p]) });
      if (r.status === 409 || r.status === 422) { shas[p] = await now(); r = await fetch(url, { method: 'PUT', headers: head(), body: body(shas[p]) }); }
      if (!r.ok) throw r;
      shas[p] = (await r.json()).content.sha; keep(); return true;
    } catch (_) { delete shas[p]; keep(); return false; }
  }
  return {
    get on() { return !!st.key; }, get err() { return st.err; }, get sentAt() { return st.sentAt; }, get id() { return st.id; }, send, put,
    pairUrl: () => st.key && `https://ilkegits.github.io/moka/#pair=${encodeURIComponent(st.key)}`,
    async connect(key) { Object.assign(st, { key, sha: undefined, sentT: null, err: '' }); keep(); return send(true); },
    off() { delete st.key; st.sha = undefined; st.err = ''; keep(); },

}
/* Connect your phone: the computer shows a QR code holding the key; the phone's camera opens ShiCards with it,

const KEY_RE = /^(github_pat_|ghp_)\w{20,}$/;
function takePairLink() {   // runs once at start-up, before the first page is shown
  if (!location.hash.startsWith('#pair=')) return;
  const k = decodeURIComponent(location.hash.slice(6));
  history.replaceState(null, '', location.pathname + location.search + '#/');
  if (KEY_RE.test(k)) { if (!LOG.on) LOG.set(true); SYNC.connect(k).then(ok => setTimeout(() => toast(ok ? 'Connected. Claude can now read this phone’s log' : SYNC.err), 600)); }

function loadQr() {

}
function pairSheet() {

const TABS = [['decks', 'Decks', '#/'], ['learn', 'Lessons', '#/learn'], ['read', 'Read', '#/read'], ['profile', 'Profile', '#/profile']];
function renderTabs() {
  // picking words on an HSK level: its own bottom bar (Select all / Add) takes the tab bar's place, as in a select mode
  const cur = S.view === 'hsk' && S.hskLevel ? null : S.view === 'home' || S.view === 'deck' || S.view === 'bank' || S.view === 'hsk' ? 'decks' : S.view === 'course' ? 'learn' : S.view;
  const i = TABS.findIndex(t => t[0] === cur), bar = $('#tabbar'), frame = $('#frame');
  const wasShown = frame.classList.contains('tabs');
  frame.classList.toggle('tabs', i >= 0);
  if (i < 0) return;
  if (!bar.children.length) bar.innerHTML = '<span class="tab-pill"></span>' + TABS.map(([k, label, h]) =>
    `<button class="tab" data-act="tab" data-h="${h}">${I[k].replace('class="i"', 'class="i i-off"')}${IF[k]}${label}</button>`).join('');
  $$('.tab', bar).forEach((b, j) => { b.classList.toggle('on', j === i); if (j === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const pill = $('.tab-pill', bar), x = `translateX(calc(${i} * var(--tabw)))`;
  if (wasShown) { pill.style.transform = x; return; }
  pill.style.transition = 'none'; pill.style.transform = x; pill.offsetWidth; pill.style.transition = '';  // bar just appeared: no slide
}

/* the highest HSK level you can open: where onboarding placed you (db.prefs.level). Finishing a level's lessons will
   raise db.prefs.unlocked to the next one once lessons exist; until then the levels above yours stay locked */
const openLevel = () => Math.min(7, Math.max(db.prefs.level || 1, db.prefs.unlocked || 1));
const LOCK_I = `<svg viewBox="0 0 24 24" class="i" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>`;
function CourseBlock() {

  const zh = ['', '一级', '二级', '三级', '四级', '五级', '六级', '七至九级'];
  /* Basics is a slim row above the levels that opens it; its picture is on the Basics page itself */
  const basics = `<button class="crs-fold" data-act="basics-open"><span class="crs-fold-seal" style="--crs:${CRS[0][0]}">基</span>
      <span class="crs-fold-main"><b>Basics</b><small>Tones, pinyin, radicals, strokes</small></span><span class="crs-fold-chev">${I.chev}</span></button>`;
  /* the levels below the one you started on are open but folded into one row, so your own level is what you see first */
  const start = Math.min(7, db.prefs.level || 1), lowN = start - 1;
  const fold = lowN ? `<button class="crs-fold crs-low${S.lowOpen ? ' open' : ''}" data-act="crs-low" aria-expanded="${!!S.lowOpen}"><span class="crs-fold-seal" style="--crs:${CRS[1][0]}">${I.check}</span>

  const card = x => {
    const f = x.n ? x.k / x.n : 0, done = x.n && x.k >= x.n, locked = x.l > top;
    const foot = locked ? `<span class="crs-locked">${LOCK_I}Finish ${HSK_NAME(x.l - 1)} to unlock</span>`
      : !H ? '' : done ? `<span class="crs-done">${I.check}Complete</span>`

function chime() {

      const o = c.createOscillator(), v = c.createGain(); o.type = 'sine'; o.frequency.value = f * m;
      v.gain.setValueAtTime(0, t + d); v.gain.linearRampToValueAtTime(g, t + d + .008); v.gain.exponentialRampToValueAtTime(.0001, t + d + .5);
      o.connect(v).connect(c.destination); o.start(t + d); o.stop(t + d + .55);

  } catch (_) {}

const READ_PUNCT = /^[，。！？：、“”"'…（）]+$/;

function makeStory(skip) {
  const bank = db.bank, inBank = new Set(bank.map(w => w.hanzi)), done = {};
  for (const s of db.readDone) done[s.zh] = (done[s.zh] || 0) + 1;
  const pick = (kind, taken) => {
    const pool = kind === 'any' ? shuffle(bank.map(w => w.hanzi)) : shuffle(RL.cat[kind] || []);
    const h = pool.find(h => (kind === 'any' || inBank.has(h)) && !taken.has(h));
    if (h) return { h, mine: true };
    const fb = pool.find(h => !taken.has(h));
    return fb ? { h: fb, mine: false } : null;
  };
  const best = RL.T.filter(t => t[0] !== skip).map(tpl => {
    const slots = new Set(), taken = new Set(), fill = {};

    let mine = 0;

      fill[s] = r.h; taken.add(r.h); if (r.mine) mine++;

    return { tpl, fill, score: mine / Math.max(1, slots.size) + Math.random() * 0.35 - (done[tpl[0]] || 0) };

    for (const l of t.split('\n')) {

      const [h, p, e] = l.split('\t'); if (!e) continue;
      const row = { h, p, e, r: rows.length }; rows.push(row);
      const a = byHz.get(h); if (a) a.push(row); else byHz.set(h, [row]);

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const meanings = row => row.e.split('; ');

function searchEnglish(D, q) {
  q = q.toLowerCase().trim().replace(/\s+/g, ' ').replace(/^(to|a|an|the) /, '');
  if (q.length < 2) return [];
  const re = new RegExp(`(^|[^a-z])${escRe(q)}($|[^a-z])`), hits = [];
  for (const row of D.rows) {
    const e = row.lc ||= row.e.toLowerCase();
    if (!e.includes(q) || !re.test(e)) continue;
    const ms = e.split('; ').map(m => plainMeaning(m).replace(/^(to|a|an|the) /, ''));
    const k = ms.indexOf(q);
    hits.push([k === 0 ? 0 : k > 0 ? 1 : re.test(ms[0]) ? 2 : 3, row]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1].r - b[1].r);
  const seen = new Set(), out = [];
  for (const [, row] of hits) { if (seen.has(row.h)) continue; seen.add(row.h); out.push(row); if (out.length >= 12) break; }
  return out;

      if (!Q.enDirty) enEl.value = ms[0] ? plainMeaning(ms[0]) : (bankHas(Q.word)?.en || '');
      $q('#qaMeans').innerHTML = ms.length > 1 ? ms.map(m => `<button class="mean">${esc(plainMeaning(m))}</button>`).join('') : '';
      const lv = S.H?.byHz.get(Q.word)?.lv;
      $q('#qaNote').textContent = `${lv ? HSK_NAME(lv) : S.H ? 'not on the HSK lists' : ''}${lv || S.H ? ' · ' : ''}editable`;
    };
    const paintWord = () => {
      hzEl.textContent = Q.word || (Q.mode === 'write' ? 'Write a character below…' : Q.mode === 'pinyin' ? 'Type pinyin below…' : 'Search in English below…');
      hzEl.classList.toggle('ph', !Q.word);

    };
    const setWord = (w, row, typed) => {
      Q.word = w; Q.enDirty = false; Q.typed = typed || '';
      const R = readings(), said = Q.typed && R.findIndex(r => normPy(r.p) === Q.typed);   // the reading you typed comes first
      Q.reading = row ? Math.max(0, R.indexOf(row)) : said > 0 ? said : 0;

    };
    $q('#qaReads').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; Q.reading = +b.dataset.r; Q.enDirty = false; paintWord(); };
    $q('#qaMeans').onclick = e => { const b = e.target.closest('.mean'); if (!b) return; enEl.value = b.textContent; Q.enDirty = true; };

    $q('#qaBk').onclick = () => { if (Q.word) setWord([...Q.word].slice(0, -1).join('')); };
    $q('#qaNot').onclick = e => { const b = e.target.closest('[data-h]'); if (!b) return; LOG.add('qa-word-pick', { had: Q.word, picked: b.dataset.h }); setWord(b.dataset.h); Q.reset?.(); };
    const paintDecks = () => {

      paintButton();
    };
    $q('#qaDecks').onclick = () => deckPicker(sel, paintDecks);
    paintDecks();

    /* --- the three ways in --- */
    const modes = {
      write() {
        const s = Math.min(300, Math.max(180, sh.clientWidth - 40 - 46));
        modeEl.innerHTML = `<div class="qa-pad"><div class="qa-tools"><button class="qa-tool" id="qaUndo" aria-label="Undo last stroke">${I.undo}</button><button class="qa-tool" id="qaClr" aria-label="Clear">${I.trash}</button></div>
          <div class="tzg no-drag" id="qaBox" style="--s:${s}px">${TZG}<canvas></canvas></div></div>
          <div class="cands" id="qaC" style="margin-bottom:8px"><span class="msg">Write one character — matches appear here.</span></div>`;
        const box = $q('#qaBox'), cv = box.querySelector('canvas'), dpr = Math.min(3, devicePixelRatio || 1), cands = $q('#qaC');
        cv.width = cv.height = s * dpr; cv.style.width = cv.style.height = s + 'px';
        box._ctx = cv.getContext('2d'); box._ctx.setTransform(dpr, 0, 0, dpr, 0, 0); box._s = s; box._strokes = [];
        let cur = null, t;
        const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp }; };
        const read = () => {
          clearTimeout(t); const seq = ++Q.seq;
          if (!box._strokes.length) { cands.innerHTML = '<span class="msg">Write one character — matches appear here.</span>'; return; }
          t = setTimeout(async () => {
            try {
              const list = (await recognize(box._strokes, s)).filter(c => [...c].length === 1 && HAN.test(c)).slice(0, 12);
              if (seq !== Q.seq) return;
              cands.innerHTML = list.length ? list.map(c => `<button class="cand">${esc(c)}</button>`).join('') : '<span class="msg">No match yet — keep writing.</span>';
              cands.scrollLeft = 0;
            } catch (_) { if (seq === Q.seq) cands.innerHTML = '<span class="msg">Offline — handwriting needs internet. Try Pinyin.</span>'; }
          }, 160);
        };
        const clearPad = () => { box._strokes = []; redraw(box); read(); };
        cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = [pt(e)]; box._strokes.push(cur); redraw(box); });
        cv.addEventListener('pointermove', e => { if (!cur) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; for (const ev of (evs.length ? evs : [e])) cur.push(pt(ev)); redraw(box); });
        const up = () => { if (cur) { cur = null; read(); } };
        cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
        $q('#qaUndo').onclick = () => { box._strokes.pop(); redraw(box); read(); };
        $q('#qaClr').onclick = clearPad;
        cands.onclick = e => { const b = e.target.closest('.cand'); if (!b) return; LOG.add('qa-write-pick', { picked: b.textContent, strokes: box._strokes.length }); setWord(Q.word + b.textContent); clearPad(); };
        Q.reset = clearPad;
      },
      pinyin() {
        modeEl.innerHTML = `<input class="input" id="qaIn" placeholder="Type pinyin — e.g. tushuguan" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
          <div class="cands" id="qaC"><span class="msg">Characters appear here as you type.</span></div>`;
        const inp = $q('#qaIn'), cands = $q('#qaC'); let t;
        const paint = list => {
          if (!inp.value) { cands.innerHTML = `<span class="msg">${Q.word ? 'Keep typing to add more.' : 'Characters appear here as you type.'}</span>`; cands._list = []; return; }
          cands.innerHTML = list.length ? list.map((x, i) => `<button class="cand" data-i="${i}">${esc(x.h)}</button>`).join('') : '<span class="msg">No match yet…</span>';
          cands.scrollLeft = 0; cands._list = list;
        };
        const lookup = () => {
          const py = normPy(inp.value); clearTimeout(t);
          if (!py) { paint([]); return; }
          const seq = ++Q.seq;
          t = setTimeout(async () => {
            try { const list = await fetchCands(py); if (seq === Q.seq) paint(list); }
            catch (e) { if (e.name !== 'AbortError' && seq === Q.seq) cands.innerHTML = '<span class="msg">Offline — pinyin lookup needs internet.</span>'; }

        };
